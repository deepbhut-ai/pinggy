# docker-compose.prod.yml — pinggy PRODUCTION deployment
#
# Usage:
#   1. Copy .env.docker to .env and edit (set DOMAIN, JWT_SECRET, payment keys)
#   2. docker compose -f docker-compose.prod.yml up -d
#
# Production differences from local:
#   - DB port NOT exposed to host (internal only)
#   - App port only on 127.0.0.1 (nginx proxies)
#   - SSH port exposed directly (required for tunnel connections)
#   - SSH host keys persisted in volume (survive rebuilds)
#   - Nginx on port 80 only (Cloudflare handles SSL)
#   - Health checks on all services
#   - Log rotation configured
#   - restart: always on all services
#

version: "3.9"

services:
  # ---- PostgreSQL Database (internal only) ----
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-pinggy}
      POSTGRES_PASSWORD: ${DB_PASS:-pinggy_secret}
      POSTGRES_DB: ${DB_NAME:-pinggy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pinggy} -d ${DB_NAME:-pinggy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pinggy-internal
    # NO ports exposed — DB is internal only

  # ---- FastAPI App + SSH Server ----
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      # SSH tunnel server — MUST be exposed directly (not through nginx/Cloudflare)
      - "${SSH_PORT:-2222}:2222"
      # FastAPI — localhost only, nginx proxies to it
      - "127.0.0.1:8000:8000"
    environment:
      # App
      APP_NAME: pinggy
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Database
      POSTGRES_USER: ${DB_USER:-pinggy}
      POSTGRES_PASSWORD: ${DB_PASS:-pinggy_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME:-pinggy}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-pinggy}:${DB_PASS:-pinggy_secret}@db:5432/${DB_NAME:-pinggy}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # SSH Tunnel
      SSH_HOST: 0.0.0.0
      SSH_PORT: 2222
      TUNNEL_DOMAIN: ${DOMAIN:-iraglobaltech.com}
      TUNNEL_PORT_MIN: 10000
      TUNNEL_PORT_MAX: 20000
      PROXY_PORT: 8000
      SUBDOMAIN_LENGTH: 7
      FREE_TUNNEL_TIMEOUT_MINUTES: 60
      # Payments
      PRO_PRICE_INR: 199.0
      PRO_PRICE_USD: 2.99
      PUBLIC_BASE_URL: https://${DOMAIN:-iraglobaltech.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
    volumes:
      # SSH host keys persisted — survive container rebuilds
      - ssh_keys:/app/ssh_host_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pinggy-internal
      - pinggy-web

  # ---- Nginx Reverse Proxy (port 80 only, Cloudflare handles SSL) ----
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      # Port 443 NOT exposed — Cloudflare Flexible SSL handles HTTPS
    volumes:
      - ./nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - pinggy-web

volumes:
  pgdata:
    driver: local
  ssh_keys:
    driver: local
  nginx_logs:
    driver: local

networks:
  # Internal network — DB and app communicate
  pinggy-internal:
    driver: bridge
    internal: true
  # Web network — nginx and app communicate (nginx exposed to outside)
  pinggy-web:
    driver: bridge