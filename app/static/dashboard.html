<!DOCTYPE html>
<html lang="en" data-color-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — pinggy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Mantine-inspired dark theme matching pinggy.io */
    --font: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

    /* Brand colors */
    --brand: #6aa6f0;
    --brand-hover: #4785ea;
    --brand-light: rgba(106,166,240,.15);
    --brand-light-hover: rgba(106,166,240,.2);

    /* Slate dark theme */
    --bg: #141618;
    --surface: #1b1e21;
    --surface-1: #222529;
    --surface-2: #2a2d31;
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.12);
    --text: #f1f3f5;
    --text-dim: #8a9099;
    --text-muted: #adb3ba;

    /* Status colors */
    --green: #29a97f;
    --green-bg: rgba(41,169,127,.15);
    --red: #de5f4b;
    --red-bg: rgba(222,95,75,.15);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,.15);

    /* Radius */
    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 12px;

    /* Spacing */
    --sp-xs: .375rem;
    --sp-sm: .5rem;
    --sp-md: 1rem;
    --sp-lg: 1.5rem;
    --sp-xl: 2rem;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--brand-light); }

  /* ---- Login ---- */
  #loginView { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 380px; }
  .login-card .logo { font-size: 1.75rem; font-weight: 800; margin-bottom: .25rem; }
  .login-card .subtitle { color: var(--text-dim); font-size: .875rem; margin-bottom: 1.5rem; }

  /* ---- AppShell Layout ---- */
  #appView { display: none; }
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .app-header .logo { font-size: 1.25rem; font-weight: 800; }
  .app-header .right { display: flex; align-items: center; gap: .75rem; }
  .user-badge { display: flex; align-items: center; gap: .5rem; padding: .375rem .75rem; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); font-size: .825rem; color: var(--text-dim); cursor: pointer; transition: .15s; }
  .user-badge:hover { border-color: var(--border-hover); background: var(--surface-2); }
  .user-badge .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; }

  .app-body { display: flex; flex: 1; }
  .app-nav { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: .75rem 0; flex-shrink: 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: .625rem; padding: .5rem 1.25rem; color: var(--text-dim); font-size: .875rem; font-weight: 500; border-left: 3px solid transparent; transition: .15s; cursor: pointer; }
  .nav-item:hover { background: var(--surface-1); color: var(--text); }
  .nav-item.active { color: var(--brand); border-left-color: var(--brand); background: var(--brand-light); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-sep { height: 1px; background: var(--border); margin: .5rem 1rem; }
  .nav-section { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: .5rem 1.25rem; font-weight: 600; }

  .app-main { flex: 1; padding: 1.5rem; overflow-y: auto; max-width: 900px; }
  .page-title { font-size: 1.5rem; font-weight: 800; margin-bottom: .25rem; }
  .page-subtitle { color: var(--text-dim); font-size: .875rem; margin-bottom: 1.5rem; }
  .page-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .page-toolbar-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .section-label { color: var(--text-dim); font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .quickstart-intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; background: linear-gradient(115deg, var(--surface) 0%, var(--surface-1) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .quickstart-intro h2 { font-size: 1.15rem; margin: .25rem 0 .35rem; }
  .quickstart-intro p { color: var(--text-dim); font-size: .85rem; max-width: 560px; }
  .quickstart-intro .intro-mark { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid rgba(106,166,240,.35); border-radius: 50%; background: var(--brand-light); color: var(--brand); font-size: 1.5rem; }
  .quickstart-step .tl-card { box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .command-panel { border-color: rgba(106,166,240,.22); }
  .command-panel .cmd-box { border-color: rgba(106,166,240,.25); }
  .token-table-wrap { overflow-x: auto; }
  .token-table { min-width: 760px; }
  .token-table th:last-child, .token-table td:last-child { text-align: right; }
  .token-actions { white-space: nowrap; }
  .token-actions .btn { min-width: 34px; }
  .token-value { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .45rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .token-meta { color: var(--text-dim); font-size: .75rem; }

  /* ---- Forms ---- */
  label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: .3rem; font-weight: 500; }
  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .75rem; color: var(--text); font-size: .875rem; font-family: var(--font); outline: none; transition: .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-light); }
  input::placeholder { color: var(--text-muted); }
  input[type="checkbox"], input[type="radio"] { width: auto; margin: 0; cursor: pointer; accent-color: var(--brand); }
  .form-group { margin-bottom: 1rem; }
  .form-row { display: flex; gap: 1rem; }
  .form-row .form-group { flex: 1; }

  /* ---- Buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; background: var(--brand); color: #fff; border: none; border-radius: var(--radius); padding: .5rem 1rem; font-size: .875rem; font-weight: 600; font-family: var(--font); cursor: pointer; transition: .15s; }
  .btn:hover { background: var(--brand-hover); }
  .btn-sm { padding: .3rem .625rem; font-size: .8rem; }
  .btn-lg { padding: .625rem 1.25rem; font-size: .95rem; }
  .btn-ghost { background: var(--surface-1); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-hover); }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #c85740; }
  .btn svg { width: 16px; height: 16px; }

  /* ---- Cards (Paper) ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 1rem; overflow: hidden; }
  .card-header { padding: .75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-header h2 { font-size: 1rem; font-weight: 700; }
  .card-body { padding: 1rem; }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); font-size: .825rem; }
  th { color: var(--text-dim); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: var(--surface-1); }
  tr:last-child td { border-bottom: none; }

  /* ---- Badges ---- */
  .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .125rem .5rem; border-radius: var(--radius-sm); font-size: .75rem; font-weight: 600; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-blue { background: var(--brand-light); color: var(--brand); }

  /* ---- Toast ---- */
  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: .625rem 1rem; font-size: .825rem; display: none; z-index: 999; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #toast.show { display: block; animation: slideIn .3s; }
  #toast.success { border-color: var(--green); }
  #toast.error { border-color: var(--red); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .empty { text-align: center; color: var(--text-dim); padding: 2rem; font-size: .875rem; }
  .code { font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); }

  /* ---- Timeline (pinggy.io style) ---- */
  .timeline { position: relative; padding-left: 2.5rem; }
  .timeline::before { content: ''; position: absolute; left: .875rem; top: 1.5rem; bottom: 1rem; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 1.25rem; }
  .tl-bullet { position: absolute; left: -2.5rem; top: 0; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--brand); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; z-index: 1; }
  .tl-title h3 { font-size: 1rem; font-weight: 700; margin-bottom: .125rem; }
  .tl-title p { font-size: .825rem; color: var(--text-dim); margin-bottom: .5rem; }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; margin-top: .5rem; }

  /* ---- OS tabs ---- */
  .os-tabs { display: flex; gap: .25rem; margin-bottom: .75rem; }
  .os-tab { display: flex; align-items: center; gap: .375rem; padding: .375rem .75rem; cursor: pointer; color: var(--text-dim); font-size: .825rem; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); transition: .15s; }
  .os-tab:hover { color: var(--text); border-color: var(--border-hover); }
  .os-tab.active { color: var(--brand); border-color: var(--brand); background: var(--brand-light); }
  .os-tab svg { width: 16px; height: 16px; }

  /* ---- Command box ---- */
  .cmd-box { position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .625rem 2.75rem .625rem .75rem; }
  .cmd-box pre { font-family: var(--font-mono); font-size: .8rem; white-space: pre-wrap; word-break: break-all; color: var(--text); line-height: 1.5; }
  .cmd-box .copy-btn { position: absolute; top: .375rem; right: .375rem; }

  /* ---- Token row ---- */
  .token-row { display: flex; gap: .375rem; align-items: center; }
  .token-row input { flex: 1; }
  .icon-btn { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: .375rem; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: .15s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface-2); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---- Tunnel banner ---- */
  .tunnel-banner { padding: .75rem 1rem; background: var(--green-bg); border: 1px solid rgba(41,169,127,.3); border-radius: var(--radius-lg); display: flex; align-items: center; gap: .75rem; }
  .tunnel-banner .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; flex-shrink: 0; }
  .tunnel-banner .url { font-size: 1rem; font-weight: 700; color: var(--brand); background: var(--bg); padding: .375rem .75rem; border-radius: var(--radius); border: 1px solid var(--border); }

  /* ---- Domain section ---- */
  .domain-box { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); }
  details summary { cursor: pointer; }
  details summary:focus { outline: none; }

  /* ---- Info box ---- */
  .info-box { padding: .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: .825rem; color: var(--text-dim); line-height: 1.6; }
  .info-box strong { color: var(--text); }

  /* ---- Stat cards (subscription page) ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
  .stat-card .label { font-size: .75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; margin-bottom: .25rem; }
  .stat-card .value { font-size: 1.5rem; font-weight: 800; color: var(--text); }

  /* ---- Payment buttons ---- */
  .pay-btn { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 1rem; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); cursor: pointer; transition: .15s; }
  .pay-btn:hover { border-color: var(--brand); background: var(--surface-2); }
  .pay-btn-disabled { opacity: .5; cursor: not-allowed; }
  .pay-btn-disabled:hover { border-color: var(--border); background: var(--surface-1); }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    .app-nav { display: none; }
    .app-main { padding: 1rem; }
    .form-row { flex-direction: column; }
    .page-toolbar { flex-direction: column; }
    .page-toolbar-actions { width: 100%; }
    .page-toolbar-actions .btn { flex: 1; }
    .quickstart-intro { grid-template-columns: 1fr; padding: 1rem; }
    .quickstart-intro .intro-mark { display: none; }
    .timeline { padding-left: 2rem; }
    .tl-bullet { left: -2rem; }
  }
</style>
</head>
<body>

<!-- Loading screen (shown while checking auth) -->
<div id="loadingScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="font-size:1.5rem;font-weight:800;margin-bottom:1rem">⚡ Tunnel</div>
    <div style="color:var(--text-dim);font-size:.875rem">Loading...</div>
  </div>
</div>

<!-- Login View (hidden — auth is on /login page) -->
<div id="loginView" style="display:none">
  <div class="login-card">
    <div class="logo">⚡ pinggy</div>
    <div class="subtitle">Sign in to manage your tunnels</div>
    <div class="form-group">
      <label>Email / Username</label>
      <input type="text" id="loginEmail" placeholder="user@example.com" value="test">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password" value="test">
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    <p style="margin-top:1rem;font-size:.8rem;color:var(--text-dim)">Default: <strong>admin</strong> / <strong>admin</strong> (change after first login)</p>
  </div>
</div>

<!-- App View -->
<div id="appView">
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">⚡ pinggy</div>
      <div class="right">
        <div class="user-badge" id="userBadge" onclick="logout()">
          <div class="avatar" id="userAvatar">U</div>
          <span id="userInfo">user</span>
        </div>
      </div>
    </header>

    <div class="app-body">
      <!-- Navbar -->
      <nav class="app-nav">
        <div class="nav-item active" data-page="quickstart" onclick="navigate('quickstart', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Quickstart
        </div>
        <div class="nav-sep"></div>
        <div class="nav-item" data-page="configure" onclick="navigate('configure', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Configure Tunnel
        </div>
        <div class="nav-item" data-page="domains" onclick="navigate('domains', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Domains
        </div>
        <div class="nav-item" data-page="tunnels" onclick="navigate('tunnels', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Active Tunnels
        </div>
        <div class="nav-item" data-page="tokens" onclick="navigate('tokens', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Manage Tokens
        </div>
        <div class="nav-sep"></div>
        <div class="nav-item" data-page="subscription" onclick="navigate('subscription', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          Subscription
        </div>
      </nav>

      <!-- Main content -->
      <main class="app-main" id="pageContent">
        <div class="card"><div class="card-body"><p class="empty">Loading...</p></div></div>
      </main>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Modal Dialog -->
<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998;align-items:center;justify-content:center">
  <div id="modalBox" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:420px;margin:1rem">
    <h3 id="modalTitle" style="font-size:1.1rem;font-weight:700;margin-bottom:1rem"></h3>
    <div id="modalBody"></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" id="modalConfirm" onclick="">Confirm</button>
    </div>
  </div>
</div>

<script>
// ---- State ----
let authToken = localStorage.getItem('pinggy_token') || '';
let currentUser = null;
let tunnelState = { localPort: 8080, os: 'cmd', token: '', tokenVisible: false, info: null };
let tunnelPollTimer = null;

// ---- API helper ----
async function api(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = body;
  const resp = await fetch('/api/v1' + path, opts);
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: 'Request failed' }));
    throw new Error(err.detail || `HTTP ${resp.status}`);
  }
  const text = await resp.text();
  return text ? JSON.parse(text) : {};
}

// ---- Toast ----
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => t.className = '', 3000);
}

// ---- Auth ----
async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const resp = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!resp.ok) throw new Error('Invalid credentials');
    const data = await resp.json();
    authToken = data.access_token;
    localStorage.setItem('pinggy_token', authToken);
    currentUser = data.user;
    showApp();
  } catch (e) { toast(e.message, 'error'); }
}

function logout() {
  authToken = '';
  localStorage.removeItem('pinggy_token');
  window.location.href = '/login';
}

async function showApp() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userInfo').textContent = currentUser.email;
  document.getElementById('userAvatar').textContent = (currentUser.email || 'U')[0].toUpperCase();

  // Payment redirect feedback — show toast and navigate to subscription
  const urlParams = new URLSearchParams(window.location.search);
  const paymentStatus = urlParams.get('payment');
  if (paymentStatus === 'success') {
    window.history.replaceState({}, '', '/dashboard');
    toast('🎉 Payment successful! Your Pro plan is being activated.');
    navigate('subscription', document.querySelector('[data-page=subscription]'));
    return;
  } else if (paymentStatus === 'cancel') {
    window.history.replaceState({}, '', '/dashboard');
    toast('Payment cancelled — no charge was made', 'error');
  }

  navigate('quickstart', document.querySelector('[data-page=quickstart]'));
}

// ---- Navigation ----
function navigate(page, el) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  stopTunnelPolling();
  if (page === 'quickstart') loadQuickstart();
  else if (page === 'configure') loadConfigure();
  else if (page === 'domains') loadDomains();
  else if (page === 'tunnels') loadTunnels();
  else if (page === 'tokens') loadTokens();
  else if (page === 'subscription') loadSubscription();
}

function buildConfigCommand() {
  const info = tunnelState.info;
  if (!info) return '';
  const addr = document.getElementById('cfgLocalAddr')?.value || `127.0.0.1:${tunnelState.localPort}`;
  const port = addr.split(':').pop() || '8080';
  const token = document.getElementById('cfgToken')?.value || tunnelState.token;
  const platform = document.getElementById('cfgPlatform')?.value || 'windows';
  const keepAlive = document.getElementById('cfgKeepAlive')?.checked !== false;
  const strictHost = document.getElementById('cfgStrictHostKey')?.checked;
  const verbose = document.getElementById('cfgVerbose')?.checked;

  let cmd = 'ssh';
  if (verbose) cmd += ' -v';
  cmd += ` -p ${info.ssh_port}`;
  cmd += ` -R0:127.0.0.1:${port}`;
  if (keepAlive) cmd += ' -o ServerAliveInterval=30';
  if (!strictHost) cmd += ' -o StrictHostKeyChecking=no';
  cmd += ` ${token}@ssh.iraglobaltech.com`;
  return cmd;
}

  const el = document.getElementById('cfgCommand');
  if (el) el.textContent = buildConfigCommand();

  // Update URL preview
  const tokenSelect = document.getElementById('cfgToken');

  if (tokenSelect && urlEl) {
    const token = tokenSelect.value;
    import_hash = (s => { let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0; return Math.abs(h).toString(16).substring(0,7); })(token);
    // Use MD5-like hash for display
    let hash = 0;
    for (let i = 0; i < token.length; i++) { hash = ((hash << 5) - hash + token.charCodeAt(i)) | 0; }
    const sub = Math.abs(hash).toString(16).substring(0, 7).padStart(7, '0');
    urlEl.textContent = `https://${sub}.iraglobaltech.com`;
  }

  // Update platform hint
  const platform = document.getElementById('cfgPlatform')?.value || 'windows';
  const hint = document.getElementById('cfgPlatformHint');
  if (hint) {
    const hints = {
      windows: 'Open Command Prompt (CMD) and paste the following command:',
      linux: 'Open terminal and paste the following command:',
      mac: 'Open Terminal and paste the following command:'
    };
    hint.textContent = hints[platform];
  }
}

function switchTokenOs(os, btn) {
  document.querySelectorAll('#tokenOsTabs .os-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (window._tokenSshConfig) window._tokenSshConfig.os = os;
  const hint = document.getElementById('tokenOsHint');
  const commandTitle = document.getElementById('tokenCmdTitle');
  const windowsCommand = document.getElementById('tokenWindowsCmdWrap');
  if (os === 'windows') {
    hint.innerHTML = 'Open <strong>PowerShell</strong> and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this PowerShell command';
    if (windowsCommand) windowsCommand.style.display = 'block';
  } else if (os === 'linux') {
    hint.innerHTML = 'Open your <strong>terminal</strong> (Ctrl+Alt+T) and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this Terminal command';
    if (windowsCommand) windowsCommand.style.display = 'none';
  } else {
    hint.innerHTML = 'Open <strong>Terminal</strong> (Cmd+Space → "Terminal") and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this Terminal command';
    if (windowsCommand) windowsCommand.style.display = 'none';
  }
  updateTokenCmd();
}

function updateTokenCmd() {
  const port = document.getElementById('tokenLocalPort').value || '8080';
  const config = window._tokenSshConfig;
  if (!config) return;
  const ssh = `ssh -p ${config.sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${config.token}@ssh.iraglobaltech.com`;
  let command = ssh;
  if (document.getElementById('tokenAutoReconnect')?.checked) {
    if (config.os === 'windows') {
      command = `while ($true) { ${ssh}; Write-Host "Disconnected. Reconnecting in 5 seconds..."; Start-Sleep -Seconds 5 }`;
    } else {
      command = `while true; do\n  ${ssh}\n  echo "Disconnected. Reconnecting in 5 seconds..."\n  sleep 5\ndone`;
    }
  }
  document.getElementById('tokenSshCmd').textContent = command;
  const windowsCommand = `ssh -p ${config.sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${config.token}@ssh.iraglobaltech.com`;
  const windowsCommandEl = document.getElementById('tokenWindowsCmd');
  if (windowsCommandEl) windowsCommandEl.textContent = windowsCommand;
}

    <p style="font-size:.875rem;color:var(--text-dim);line-height:1.6">
      Are you sure you want to downgrade to <strong style="color:var(--text)">Free</strong>?
    </p>
    <div style="margin-top:.75rem;padding:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:.825rem;color:var(--text-dim)">
      You will lose: persistent tunnels, fixed subdomains, custom domain.<br>
      Free limits: 1 tunnel · 60-minute timeout · random subdomain.
    </div>
    <p style="font-size:.78rem;color:var(--text-dim);margin-top:.6rem">Note: an admin will process your downgrade. Your Pro stays active until then.</p>
  `, () => {
    closeModal();
    toast('Downgrade requested — contact support or admin to process', 'success');
  }, 'Request Downgrade', 'btn-danger');
}

// ---- Tunnel helpers ----
function buildSSHCommand() {
  const info = tunnelState.info;
  if (!info) return '';
  if (!tunnelState.token) return 'Create a token first in Manage Tokens →';
  const port = tunnelState.localPort;
  const token = tunnelState.token;
  const sshPort = info.ssh_port;
  const sshHost = info.domain.includes('iraglobaltech.com') ? 'ssh.iraglobaltech.com' : info.domain;
  const ssh = `ssh -p ${sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${token}@${sshHost}`;
  if (!document.getElementById('autoReconnectInput')?.checked) return ssh;
  const os = tunnelState.os || 'cmd';
  if (os === 'cmd') {
    return `for /L %i in (0,1,2147483647) do @(${ssh} & echo Disconnected. Reconnecting in 5 seconds... & timeout /t 5 /nobreak >nul)`;
  }
  if (os === 'powershell') {
    return `while ($true) { ${ssh}; Write-Host "Disconnected. Reconnecting in 5 seconds..."; Start-Sleep -Seconds 5 }`;
  }
  return `while true; do\n  ${ssh}\n  echo "Disconnected. Reconnecting in 5 seconds..."\n  sleep 5\ndone`;
}

function updateSSHCommand() {
  const el = document.getElementById('sshCommand');
  if (el) el.textContent = buildSSHCommand();
}

function updateLocalPort(port) {
  tunnelState.localPort = parseInt(port) || 8080;
  updateSSHCommand();
}

function switchOS(os, el) {
  document.querySelectorAll('#osTabs .os-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  tunnelState.os = os;
  const hint = document.getElementById('osHint');
  if (hint) {
    const hints = {
      cmd: 'Open Command Prompt (CMD) and paste the following command:',
      powershell: 'Open PowerShell and paste the following command:',
      linux: 'Open your terminal (Ctrl+Alt+T) and paste the following command:',
      mac: 'Open Terminal (Cmd+Space → "Terminal") and paste the following command:'
    };
    hint.textContent = hints[os] || hints.cmd;
  }
  updateSSHCommand();
}

// ---- Polling ----
function startTunnelPolling() {
  stopTunnelPolling();
  tunnelPollTimer = setInterval(async () => {
    if (!document.getElementById('sshCommand')) return;
    try {
      const tunnels = await api('/tunnels/my');
      updateTunnelBanner(tunnels);
      updateTunnelTable(tunnels);
    } catch {}
  }, 5000);
}

function stopTunnelPolling() {
  if (tunnelPollTimer) { clearInterval(tunnelPollTimer); tunnelPollTimer = null; }
}

function updateTunnelBanner(tunnels) {
  const banner = document.getElementById('tunnelBanner');
  if (!banner) return;
  if (tunnels.length > 0) {
    const t = tunnels[0];
    banner.style.display = 'block';
    banner.className = 'tunnel-banner';
    const customUrlHtml = t.custom_url
      ? `<div style="margin-top:.25rem"><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-weight:600;font-size:.95rem">${t.custom_url}</a> <button class="btn btn-sm" style="padding:.2rem .5rem;font-size:.75rem" onclick="copyToClipboard('${t.custom_url}')">📋</button></div>`
      : '';
    banner.innerHTML = `
      <div class="dot"></div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:1.1rem;color:var(--primary)">Tunnel Active!</div>
        <div style="font-size:.9rem;color:var(--text-dim)">Your tunnel URL:</div>
        ${customUrlHtml}
      </div>
      <a href="${t.url}" target="_blank" class="url">${t.url}</a>
      <button class="btn btn-sm" onclick="copyToClipboard('${t.url}')">📋 Copy</button>`;
  } else {
    banner.style.display = 'none';
  }
}

function updateTunnelTable(tunnels) {
  const tbody = document.getElementById('tunnelTableBody');
  const countEl = document.getElementById('tunnelCount');
  if (!tbody) return;
  if (countEl) countEl.textContent = tunnels.length;
  if (tunnels.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No active tunnels yet. Use the command above to create one.</td></tr>';
    return;
  }
  tbody.innerHTML = tunnels.map(t => {
    const urlCell = t.custom_url
      ? `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a><br><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-size:.8rem;font-weight:600">${t.custom_url}</a></td>`
      : `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a></td>`;
    return `<tr>
    ${urlCell}
    <td class="code">${t.subdomain}</td>
    <td>${t.request_count}</td>
    <td>${(t.bytes_transferred / 1024).toFixed(1)} KB</td>
    <td><span class="badge badge-green">${t.status}</span></td>
    <td>${t.created_at.replace('T',' ').substring(0,19)}</td>
  </tr>`;
  }).join('');
}

// ---- Custom Domain ----
async function saveMyCustomDomain(clear) {
  const input = document.getElementById('myCustomDomain') || document.getElementById('domainInput');
  const domain = clear ? '' : input.value.trim();
  if (!clear && !domain) { toast('Enter a domain first', 'error'); return; }
  try {
    await api(`/users/me/custom-domain?custom_domain=${encodeURIComponent(domain)}`, 'PUT');
    toast(clear ? 'Custom domain cleared' : 'Custom domain saved');
    if (clear) input.value = '';
    loadQuickstart();
  } catch (e) { toast(e.message, 'error'); }
}

// ---- Clipboard helpers ----
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch { toast('Copy failed', 'error'); }
    document.body.removeChild(ta);
  });
}
function copyToken() { copyToClipboard(tunnelState.token); }
function copySSHCmd() { copyToClipboard(buildSSHCommand()); }
function copyCfgCmd() { copyToClipboard(buildSSHCommand()); }
function toggleTokenVisibility() {
  const el = document.getElementById('accessToken');
  if (el) { el.type = el.type === 'password' ? 'text' : 'password'; }
}

// ---- Init ----
async function checkAuth() {
  if (!authToken) {
    window.location.replace('/login');
    return false;
  }
  try {
    const resp = await fetch('/api/v1/auth/me', { headers: { 'Authorization': `Bearer ${authToken}` } });
    if (!resp.ok) throw new Error('Token expired');
    currentUser = await resp.json();
    return true;
  } catch {
    localStorage.removeItem('pinggy_token');
    authToken = '';
    window.location.replace('/login');
    return false;
  }
}

// Detect back/forward navigation (bfcache) — immediately hide and check auth
window.addEventListener('pageshow', (event) => {
  if (event.persisted || (performance && performance.getEntriesByType && performance.getEntriesByType('navigation').some(n => n.type === 'back_forward'))) {
    // Page restored from bfcache — immediately hide ALL content synchronously
    if (!localStorage.getItem('pinggy_token')) {
      document.documentElement.style.visibility = 'hidden';
      window.location.replace('/login');
    } else {
      checkAuth();
    }
  }
});

(async function init() {
  if (await checkAuth()) {
    showApp();
  }
})();
</script>
