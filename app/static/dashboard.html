<!DOCTYPE html>
<html lang="en" data-color-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — pinggy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Mantine-inspired dark theme matching pinggy.io */
    --font: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

    /* Brand colors */
    --brand: #6aa6f0;
    --brand-hover: #4785ea;
    --brand-light: rgba(106,166,240,.15);
    --brand-light-hover: rgba(106,166,240,.2);

    /* Slate dark theme */
    --bg: #141618;
    --surface: #1b1e21;
    --surface-1: #222529;
    --surface-2: #2a2d31;
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.12);
    --text: #f1f3f5;
    --text-dim: #8a9099;
    --text-muted: #adb3ba;

    /* Status colors */
    --green: #29a97f;
    --green-bg: rgba(41,169,127,.15);
    --red: #de5f4b;
    --red-bg: rgba(222,95,75,.15);
    --amber: #f59e0b;
    --amber-bg: rgba(245,158,11,.15);

    /* Radius */
    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 12px;

    /* Spacing */
    --sp-xs: .375rem;
    --sp-sm: .5rem;
    --sp-md: 1rem;
    --sp-lg: 1.5rem;
    --sp-xl: 2rem;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::selection { background: var(--brand-light); }

  /* ---- Login ---- */
  #loginView { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2rem; width: 100%; max-width: 380px; }
  .login-card .logo { font-size: 1.75rem; font-weight: 800; margin-bottom: .25rem; }
  .login-card .subtitle { color: var(--text-dim); font-size: .875rem; margin-bottom: 1.5rem; }

  /* ---- AppShell Layout ---- */
  #appView { display: none; }
  .app-shell { display: flex; flex-direction: column; min-height: 100vh; }
  .app-header { background: rgba(27, 30, 33, 0.92); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 62px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0,0,0,.14); }
  .app-header .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -.03em; }
  .app-header .right { display: flex; align-items: center; gap: .75rem; }
  .user-badge { display: flex; align-items: center; gap: .5rem; padding: .375rem .75rem; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); font-size: .825rem; color: var(--text-dim); cursor: pointer; transition: .15s; }
  .user-badge:hover { border-color: var(--border-hover); background: var(--surface-2); }
  .user-badge .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; }

  .app-body { display: flex; flex: 1; }
  .app-nav { width: 260px; background: linear-gradient(180deg, rgba(27,30,33,1) 0%, rgba(20,22,24,1) 100%); border-right: 1px solid var(--border); padding: .75rem 0; flex-shrink: 0; position: sticky; top: 62px; height: calc(100vh - 62px); overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: .625rem; padding: .55rem 1.25rem; color: var(--text-dim); font-size: .875rem; font-weight: 500; border-left: 3px solid transparent; transition: .15s; cursor: pointer; margin: 0 .5rem; border-radius: 10px; }
  .nav-item:hover { background: var(--surface-1); color: var(--text); }
  .nav-item.active { color: var(--brand); border-left-color: var(--brand); background: linear-gradient(90deg, rgba(106,166,240,.12), rgba(106,166,240,.04)); box-shadow: inset 0 0 0 1px rgba(106,166,240,.08); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-sep { height: 1px; background: var(--border); margin: .5rem 1rem; }
  .nav-section { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: .5rem 1.25rem; font-weight: 600; }

  .app-main { flex: 1; padding: 1.5rem; overflow-y: auto; max-width: 1100px; }
  .page-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: .25rem; }
  .page-subtitle { color: var(--text-dim); font-size: .875rem; margin-bottom: 1.5rem; }
  .page-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .page-toolbar-actions { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
  .section-label { color: var(--text-dim); font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .quickstart-intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; background: linear-gradient(115deg, var(--surface) 0%, var(--surface-1) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 18px 34px rgba(0,0,0,.10); }
  .quickstart-intro h2 { font-size: 1.15rem; margin: .25rem 0 .35rem; }
  .quickstart-intro p { color: var(--text-dim); font-size: .85rem; max-width: 560px; }
  .quickstart-intro .intro-mark { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid rgba(106,166,240,.35); border-radius: 50%; background: var(--brand-light); color: var(--brand); font-size: 1.5rem; box-shadow: 0 0 0 8px rgba(106,166,240,.05); }
  .feature-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .feature-badge { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .6rem; border-radius: 999px; background: rgba(255,255,255,.02); border: 1px solid var(--border); color: var(--text-dim); font-size: .72rem; font-weight: 600; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: 0 0 1.25rem; }
  .summary-card { background: linear-gradient(180deg, var(--surface) 0%, var(--surface-1) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
  .summary-label { font-size: .725rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: .5rem; }
  .summary-value { font-size: 1.05rem; color: var(--text); font-weight: 700; line-height: 1.4; word-break: break-word; }
  .summary-sub { margin-top: .35rem; color: var(--text-dim); font-size: .78rem; }
  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .5rem; border-radius: 999px; background: var(--brand-light); border: 1px solid rgba(106,166,240,.25); color: var(--brand); font-size: .72rem; font-weight: 700; }
  .workspace-strip { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .85rem 1rem; margin-bottom: 1.25rem; background: linear-gradient(135deg, rgba(106,166,240,.09), rgba(41,169,127,.07)); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .workspace-strip .left { display: flex; align-items: center; gap: .75rem; }
  .workspace-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(41,169,127,.9); }
  .workspace-name { font-weight: 700; }
  .workspace-meta { color: var(--text-dim); font-size: .78rem; }
  .workspace-chips { display: flex; gap: .5rem; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; padding: .3rem .6rem; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,.02); color: var(--text-dim); font-size: .72rem; font-weight: 600; }
  .live-overview { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
  .live-overview-card { background: linear-gradient(135deg, rgba(106,166,240,.08) 0%, rgba(41,169,127,.08) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; box-shadow: inset 0 1px 0 rgba(255,255,255,.02); }
  .live-overview-card .heading { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; }
  .live-overview-card .heading strong { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); }
  .live-link { display: inline-flex; align-items: center; gap: .5rem; background: rgba(0,0,0,.18); border: 1px solid rgba(106,166,240,.25); color: var(--brand); padding: .5rem .75rem; border-radius: var(--radius); font-weight: 700; font-size: .92rem; word-break: break-all; }
  .live-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin-top: .75rem; }
  .meta-box { background: rgba(0,0,0,.18); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem; }
  .meta-box .label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: .35rem; }
  .meta-box .value { font-size: .96rem; color: var(--text); font-weight: 700; word-break: break-word; }
  .quickstart-step .tl-card { box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .command-panel { border-color: rgba(106,166,240,.22); }
  .command-panel .cmd-box { border-color: rgba(106,166,240,.25); }
  .token-table-wrap { overflow-x: auto; }
  .token-table { min-width: 760px; }
  .token-table th:last-child, .token-table td:last-child { text-align: right; }
  .token-actions { white-space: nowrap; }
  .token-actions .btn { min-width: 34px; }
  .token-value { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .45rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .token-meta { color: var(--text-dim); font-size: .75rem; }

  /* ---- Forms ---- */
  label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: .3rem; font-weight: 500; }
  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem .75rem; color: var(--text); font-size: .875rem; font-family: var(--font); outline: none; transition: .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-light); }
  input::placeholder { color: var(--text-muted); }
  input[type="checkbox"], input[type="radio"] { width: auto; margin: 0; cursor: pointer; accent-color: var(--brand); }
  .form-group { margin-bottom: 1rem; }
  .form-row { display: flex; gap: 1rem; }
  .form-row .form-group { flex: 1; }

  /* ---- Buttons ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; background: var(--brand); color: #fff; border: none; border-radius: var(--radius); padding: .5rem 1rem; font-size: .875rem; font-weight: 600; font-family: var(--font); cursor: pointer; transition: .15s; }
  .btn:hover { background: var(--brand-hover); }
  .btn-sm { padding: .3rem .625rem; font-size: .8rem; }
  .btn-lg { padding: .625rem 1.25rem; font-size: .95rem; }
  .btn-ghost { background: var(--surface-1); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface-2); border-color: var(--border-hover); }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #c85740; }
  .btn svg { width: 16px; height: 16px; }

  /* ---- Cards (Paper) ---- */
  .card { background: linear-gradient(180deg, rgba(27,30,33,1) 0%, rgba(22,24,27,1) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 1rem; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.12); }
  .card-header { padding: .75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-header h2 { font-size: 1rem; font-weight: 700; }
  .card-body { padding: 1rem; }

  /* ---- Tables ---- */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); font-size: .825rem; }
  th { color: var(--text-dim); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: var(--surface-1); }
  tr:last-child td { border-bottom: none; }

  /* ---- Badges ---- */
  .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .125rem .5rem; border-radius: var(--radius-sm); font-size: .75rem; font-weight: 600; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-blue { background: var(--brand-light); color: var(--brand); }

  /* ---- Toast ---- */
  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: .625rem 1rem; font-size: .825rem; display: none; z-index: 999; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #toast.show { display: block; animation: slideIn .3s; }
  #toast.success { border-color: var(--green); }
  #toast.error { border-color: var(--red); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .empty { text-align: center; color: var(--text-dim); padding: 2rem; font-size: .875rem; }
  .code { font-family: var(--font-mono); font-size: .8rem; color: var(--text-dim); }

  /* ---- Timeline (pinggy.io style) ---- */
  .timeline { position: relative; padding-left: 2.5rem; }
  .timeline::before { content: ''; position: absolute; left: .875rem; top: 1.5rem; bottom: 1rem; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 1.25rem; }
  .tl-bullet { position: absolute; left: -2.5rem; top: 0; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--brand); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; z-index: 1; }
  .tl-title h3 { font-size: 1rem; font-weight: 700; margin-bottom: .125rem; }
  .tl-title p { font-size: .825rem; color: var(--text-dim); margin-bottom: .5rem; }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; margin-top: .5rem; }

  /* ---- OS tabs ---- */
  .os-tabs { display: flex; gap: .25rem; margin-bottom: .75rem; }
  .os-tab { display: flex; align-items: center; gap: .375rem; padding: .375rem .75rem; cursor: pointer; color: var(--text-dim); font-size: .825rem; font-weight: 500; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); transition: .15s; }
  .os-tab:hover { color: var(--text); border-color: var(--border-hover); }
  .os-tab.active { color: var(--brand); border-color: var(--brand); background: var(--brand-light); }
  .os-tab svg { width: 16px; height: 16px; }

  /* ---- Command box ---- */
  .cmd-box { position: relative; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .625rem 2.75rem .625rem .75rem; }
  .cmd-box pre { font-family: var(--font-mono); font-size: .8rem; white-space: pre-wrap; word-break: break-all; color: var(--text); line-height: 1.5; }
  .cmd-box .copy-btn { position: absolute; top: .375rem; right: .375rem; }

  /* ---- Token row ---- */
  .token-row { display: flex; gap: .375rem; align-items: center; }
  .token-row input { flex: 1; }
  .icon-btn { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: .375rem; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: .15s; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface-2); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---- Tunnel banner ---- */
  .tunnel-banner { padding: .75rem 1rem; background: var(--green-bg); border: 1px solid rgba(41,169,127,.3); border-radius: var(--radius-lg); display: flex; align-items: center; gap: .75rem; }
  .tunnel-banner .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; flex-shrink: 0; }
  .tunnel-banner .url { font-size: 1rem; font-weight: 700; color: var(--brand); background: var(--bg); padding: .375rem .75rem; border-radius: var(--radius); border: 1px solid var(--border); }

  /* ---- Domain section ---- */
  .domain-box { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); }
  details summary { cursor: pointer; }
  details summary:focus { outline: none; }

  /* ---- Info box ---- */
  .info-box { padding: .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: .825rem; color: var(--text-dim); line-height: 1.6; }
  .info-box strong { color: var(--text); }

  /* ---- Analytics section ---- */
  .analytics-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; margin: 1.25rem 0; }
  @media (max-width: 1024px) { .analytics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .metric-card { background: linear-gradient(180deg, rgba(106,166,240,.05) 0%, rgba(106,166,240,.02) 100%); border: 1px solid rgba(106,166,240,.15); border-radius: var(--radius-lg); padding: .85rem; display: flex; flex-direction: column; justify-content: space-between; }
  .metric-card .metric-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); font-weight: 700; margin-bottom: .4rem; }
  .metric-card .metric-value { font-size: 1.8rem; font-weight: 800; color: var(--text); line-height: 1; }
  .metric-card .metric-sub { font-size: .75rem; color: var(--text-dim); margin-top: .3rem; }
  .metric-card.accent { background: linear-gradient(180deg, rgba(41,169,127,.05) 0%, rgba(41,169,127,.02) 100%); border-color: rgba(41,169,127,.15); }
  .domain-health-panel { background: linear-gradient(135deg, rgba(106,166,240,.06), rgba(41,169,127,.05)); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; margin: 1.25rem 0; }
  .domain-health-panel .health-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
  .domain-health-panel .health-title { font-weight: 700; color: var(--text); }
  .domain-health-status { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border-radius: var(--radius); background: rgba(0,0,0,.15); border: 1px solid rgba(41,169,127,.2); }
  .domain-health-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(41,169,127,.8); }
  .domain-health-status .status-text { font-size: .825rem; color: var(--green); font-weight: 600; }
  .domain-health-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; margin-top: .75rem; }
  .health-item { background: rgba(0,0,0,.2); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem; display: flex; justify-content: space-between; align-items: center; }
  .health-item .item-label { font-size: .775rem; color: var(--text-dim); font-weight: 600; }
  .health-item .item-value { font-size: .85rem; color: var(--text); font-weight: 700; }

  /* ---- Stat cards (subscription page) ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
  .stat-card .label { font-size: .75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; margin-bottom: .25rem; }
  .stat-card .value { font-size: 1.5rem; font-weight: 800; color: var(--text); }

  /* ---- Payment buttons ---- */
  .pay-btn { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 1rem; background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-lg); cursor: pointer; transition: .15s; }
  .pay-btn:hover { border-color: var(--brand); background: var(--surface-2); }
  .pay-btn-disabled { opacity: .5; cursor: not-allowed; }
  .pay-btn-disabled:hover { border-color: var(--border); background: var(--surface-1); }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    .app-nav { display: none; }
    .app-main { padding: 1rem; }
    .summary-grid { grid-template-columns: 1fr; }
    .live-overview { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; }
    .page-toolbar { flex-direction: column; }
    .page-toolbar-actions { width: 100%; }
    .page-toolbar-actions .btn { flex: 1; }
    .quickstart-intro { grid-template-columns: 1fr; padding: 1rem; }
    .quickstart-intro .intro-mark { display: none; }
    .timeline { padding-left: 2rem; }
    .tl-bullet { left: -2rem; }
    .analytics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<!-- Loading screen (shown while checking auth) -->
<div id="loadingScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="font-size:1.5rem;font-weight:800;margin-bottom:1rem">⚡ Tunnel</div>
    <div style="color:var(--text-dim);font-size:.875rem">Loading...</div>

<script>
// ---- State ----
let authToken = localStorage.getItem('pinggy_token') || '';
let currentUser = null;
let tunnelState = { localPort: 8080, os: 'cmd', token: '', tokenVisible: false, info: null };
let tunnelPollTimer = null;
let tunnelRateTracker = {}; // Track {tunnelId: {lastBytes, lastTime, kbps}}
let dailyTunnelStats = JSON.parse(localStorage.getItem('dailyTunnelStats') || '{}'); // Track {date_subdomain: {sent, received}}

// ---- API helper ----
async function api(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = body;
  const resp = await fetch('/api/v1' + path, opts);
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ detail: 'Request failed' }));
    throw new Error(err.detail || `HTTP ${resp.status}`);
  }
  const text = await resp.text();
  return text ? JSON.parse(text) : {};
}

// ---- Toast ----
function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  setTimeout(() => t.className = '', 3000);
}

// ---- Daily Stats Helper ----
function getDailyKey(subdomain) {
  const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
  return `${today}_${subdomain}`;
}

function updateDailyStats(subdomain, bytesTransferred) {
  const key = getDailyKey(subdomain);
  if (!dailyTunnelStats[key]) {
    dailyTunnelStats[key] = { sent: 0, received: bytesTransferred };
  }
  // Estimate: add new bytes to daily total (simplified: assume all is "received")
  dailyTunnelStats[key].received = bytesTransferred;
  localStorage.setItem('dailyTunnelStats', JSON.stringify(dailyTunnelStats));
}

function getDailyStats(subdomain) {
  const key = getDailyKey(subdomain);
  return dailyTunnelStats[key] || { sent: 0, received: 0 };
}

function getDomainDailyTotals(tunnels) {
  let totalSent = 0, totalReceived = 0;
  tunnels.forEach(t => {
    const stats = getDailyStats(t.subdomain);
    totalSent += stats.sent;
    totalReceived += stats.received;
  });
  return { sent: totalSent, received: totalReceived };
}

// ---- Auth ----
async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const resp = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if (!resp.ok) throw new Error('Invalid credentials');
    const data = await resp.json();
    authToken = data.access_token;
    localStorage.setItem('pinggy_token', authToken);
    currentUser = data.user;
    showApp();
  } catch (e) { toast(e.message, 'error'); }
}

function logout() {
  authToken = '';
  localStorage.removeItem('pinggy_token');
  window.location.href = '/login';
}

async function showApp() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userInfo').textContent = currentUser.email;
  document.getElementById('userAvatar').textContent = (currentUser.email || 'U')[0].toUpperCase();

  // Payment redirect feedback — show toast and navigate to subscription
  const urlParams = new URLSearchParams(window.location.search);
  const paymentStatus = urlParams.get('payment');
  if (paymentStatus === 'success') {
    window.history.replaceState({}, '', '/dashboard');
    toast('🎉 Payment successful! Your Pro plan is being activated.');
    navigate('subscription', document.querySelector('[data-page=subscription]'));
    return;
  } else if (paymentStatus === 'cancel') {
    window.history.replaceState({}, '', '/dashboard');
    toast('Payment cancelled — no charge was made', 'error');
  }

  navigate('quickstart', document.querySelector('[data-page=quickstart]'));
}

// ---- Navigation ----
function navigate(page, el) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  stopTunnelPolling();
  if (page === 'quickstart') loadQuickstart();
  else if (page === 'configure') loadConfigure();
  else if (page === 'domains') loadDomains();
  else if (page === 'tunnels') loadTunnels();
  else if (page === 'inspector') loadInspector();
  else if (page === 'tokens') loadTokens();
  else if (page === 'apikeys') loadApiKeys();
  else if (page === 'usage') loadMyUsage();
  else if (page === 'announcements') loadAnnouncementsPage();
  else if (page === 'subscription') loadSubscription();
}

// ---- Announcements banner (Job 6) ----
function renderAnnouncements(anns) {
  if (!anns || !anns.length) return '';
  const color = { info: 'var(--primary)', warning: '#f59e0b', success: '#22c55e' };
  return `<div id="annBanner">${anns.map(a => `
    <div style="border:1px solid ${color[a.level] || 'var(--border)'};border-left-width:4px;border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.6rem;background:var(--surface)">
      <strong>${a.title}</strong>
      <div style="font-size:.85rem;color:var(--text-dim);margin-top:.2rem;white-space:pre-line">${a.body}</div>
    </div>`).join('')}</div>`;
}

async function fetchAnnouncements() {
  try { return await api('/announcements'); } catch { return []; }
}

// ---- API Keys (v0.10.0) ----
async function loadApiKeys() {
  const c = document.getElementById('pageContent');
  c.innerHTML = '<div class="card"><div class="card-body"><p class="empty">Loading...</p></div></div>';
  try {
    const keys = await api('/apikeys');
    const rows = keys.map(k => `<tr>
      <td>${k.name}</td>
      <td class="code">${k.prefix}…</td>
      <td>${k.created_at ? k.created_at.substring(0,10) : '—'}</td>
      <td>${k.last_used_at ? k.last_used_at.replace('T',' ').substring(0,16) : 'never'}</td>
      <td><button class="btn btn-sm btn-danger" onclick="revokeApiKey('${k.id}','${k.name}')">Revoke</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">No API keys yet</td></tr>';
    c.innerHTML = `
    <div class="page-toolbar">
      <div>
        <div class="page-title">API Keys</div>
        <div class="page-subtitle">Manage tunnels & tokens from scripts, CI, or the Python SDK.</div>
      </div>
      <div class="page-toolbar-actions"><button class="btn" id="createKeyBtn">+ Create API Key</button></div>
    </div>
    <div class="card">
      <div class="card-body" style="padding:0;overflow-x:auto">
        <table><thead><tr><th>Name</th><th>Key</th><th>Created</th><th>Last used</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>
    <div class="card" style="margin-top:1rem">
      <div class="card-header"><h2>Python SDK quick start</h2></div>
      <div class="card-body">
        <div class="cmd-box"><pre>from sdk.pinggy_sdk import TunnelClient

client = TunnelClient("${location.origin}", api_key="pk_YOUR_KEY")
print(client.tokens())            # list tokens
client.create_token(name="ci")   # make one from CI
client.stop_tunnel("mysub")      # stop a live tunnel</pre></div>
        <p style="font-size:.78rem;color:var(--text-dim);margin-top:.5rem">Or plain HTTP: send <span class="code">X-Api-Key</span> to <span class="code">/api/v1/manage/tunnels</span>, <span class="code">/manage/tokens</span>, …</p>
      </div>
    </div>`;
    document.getElementById('createKeyBtn').onclick = () => createApiKey();
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

async function createApiKey() {
  const name = prompt('Name this API key:', 'CI pipeline');
  if (!name) return;
  try {
    const k = await api('/apikeys', 'POST', { name });
    showModal('API Key Created — copy it now', `
      <p style="font-size:.8rem;color:var(--red);font-weight:600">This key is shown only once. Copy it now.</p>
      <div class="cmd-box" style="margin-top:.5rem"><pre id="newKeyVal">${k.key}</pre></div>
      <button class="btn btn-sm" style="margin-top:.6rem" onclick="copyToClipboard('${k.key}')">📋 Copy Key</button>
    `, () => { closeModal(); loadApiKeys(); }, 'Done');
  } catch (e) { toast(e.message, 'error'); }
}

async function revokeApiKey(id, name) {
  if (!confirm(`Revoke API key "${name}"? Scripts using it will stop working immediately.`)) return;
  try { await api(`/apikeys/${id}`, 'DELETE'); toast('API key revoked'); loadApiKeys(); }
  catch (e) { toast(e.message, 'error'); }
}

// ---- My Invoices (Job 8) ----

// ---- Quickstart (Page 1) ----
async function loadQuickstart() {
  const c = document.getElementById('pageContent');

  try {
    // Run all API calls in PARALLEL (not serial) for fast load
    const [info, tunnels, tokensResp] = await Promise.all([
      api('/tunnels/info'),
      api('/tunnels/my'),
      api('/tokens').catch(() => []),
    ]);
    // Use the first token from the tokens table (multi-token system)
    const userTokens = Array.isArray(tokensResp) ? tokensResp : [];
    tunnelState.token = userTokens.length > 0 ? userTokens[0].token : '';
    tunnelState.info = info;
    // Use custom_domain from the token only — never from the legacy user-level field
    const tokenCustomDomain = userTokens.length > 0 ? (userTokens[0].custom_domain || '') : '';
    info.custom_domain = tokenCustomDomain;

    let tunnelRows = tunnels.map(t => {
      const urlCell = t.custom_url
        ? `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a><br><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-size:.8rem;font-weight:600">${t.custom_url}</a></td>`
        : `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a></td>`;
      // Calculate KB/s for this tunnel
      const tunnelId = t.id || t.subdomain;
      let kbps = '—';
      const now = Date.now();
      if (tunnelRateTracker[tunnelId]) {
        const prev = tunnelRateTracker[tunnelId];
        const bytesDelta = (t.bytes_transferred || 0) - prev.lastBytes;
        const timeDeltaMs = now - prev.lastTime;
        if (timeDeltaMs > 0) {
          const kbpsDelta = (bytesDelta / 1024) / (timeDeltaMs / 1000);
          kbps = kbpsDelta.toFixed(2);
        }
      }
      tunnelRateTracker[tunnelId] = { lastBytes: t.bytes_transferred || 0, lastTime: now };
      return `<tr>
      ${urlCell}
      <td class="code">${t.subdomain}</td>
      <td>${t.request_count}</td>
      <td>${(t.bytes_transferred / 1024).toFixed(1)} KB</td>
      <td>${kbps} KB/s</td>
      <td><span class="badge badge-green">${t.status}</span></td>
      <td>${t.created_at.replace('T',' ').substring(0,19)}</td>
    </tr>`;

        <span class="workspace-dot"></span>
        <div>
          <div class="workspace-name">Workspace overview</div>
          <div class="workspace-meta">Primary tunnel environment</div>
        </div>
      </div>
      <div class="workspace-chips">
        <span class="chip">${tunnels.length ? 'Connected' : 'Ready'}</span>
        <span class="chip">${(currentUser.plan || 'free').toUpperCase()}</span>
        <span class="chip">${userTokens.length} token${userTokens.length !== 1 ? 's' : ''}</span>
      </div>
    </div>
    <div class="quickstart-intro">
      <div>
        <div class="section-label">Tunnel setup</div>
        <h2>Expose your local app in three steps</h2>
        <p>Choose a port, copy the command, and keep the terminal open while your tunnel is running.</p>
        <div class="feature-row">
          <span class="feature-badge">⚡ Fast share</span>
          <span class="feature-badge">🔒 Secure</span>
          <span class="feature-badge">🌐 Custom domain ready</span>
        </div>

    <div class="summary-grid">
      <div class="summary-card">

        <div class="summary-value">${tunnels[0] ? (tunnels[0].custom_url || tunnels[0].url) : 'No active tunnel yet'}</div>
        <div class="summary-sub">Live public URL for your workspace</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Custom domain</div>
        <div class="summary-value">${(userTokens.length > 0 && userTokens[0].custom_domain) ? userTokens[0].custom_domain : 'Not set yet'}</div>

      }
    });
    document.querySelectorAll('button').forEach(btn => {
      if (btn.textContent.includes('Refresh') && btn.getAttribute('onclick')?.includes('loadQuickstart')) {
        btn.removeAttribute('onclick');
        btn.addEventListener('click', () => loadQuickstart());
      }
    });
    const copyTokenBtn = Array.from(document.querySelectorAll('button')).find(b => b.getAttribute('onclick')?.includes('copyToken'));
    if (copyTokenBtn) {
      copyTokenBtn.removeAttribute('onclick');
      copyTokenBtn.addEventListener('click', () => {
        const tokenInput = document.getElementById('accessToken');
        if (tokenInput) copyToClipboard(tokenInput.value);
      });
    }
    const toggleBtn = Array.from(document.querySelectorAll('button')).find(b => b.getAttribute('onclick')?.includes('toggleTokenVisibility'));
    if (toggleBtn) {
      toggleBtn.removeAttribute('onclick');
      toggleBtn.addEventListener('click', () => toggleTokenVisibility());
    }

      if (btn.getAttribute('onclick')?.includes('copyToClipboard') && btn.closest('[style*="green-bg"]')) {

        const link = btn.parentElement.querySelector('a');
        if (link) btn.addEventListener('click', () => copyToClipboard(link.href));
      }
    });
    // Save custom domain button
    const saveDomainBtn = Array.from(document.querySelectorAll('button')).find(b => b.getAttribute('onclick')?.includes('saveMyCustomDomain'));
    if (saveDomainBtn) {
      saveDomainBtn.removeAttribute('onclick');
      saveDomainBtn.addEventListener('click', () => saveMyCustomDomain());
    }
  }, 100);

    updateSSHCommand();
    updateTunnelBanner(tunnels);
    startTunnelPolling();
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

  if (port) document.getElementById('cfgLocalAddr').value = `127.0.0.1:${port}`;
  updateCfgCommand();
}

function builderState() {
  const info = tunnelState.info;
  const addr = document.getElementById('cfgLocalAddr')?.value || `127.0.0.1:${tunnelState.localPort}`;
  const port = addr.split(':').pop() || '8080';
  return {
    info,
    port,
    token: document.getElementById('cfgToken')?.value || tunnelState.token,
    platform: document.getElementById('cfgPlatform')?.value || 'windows',
    keepAlive: document.getElementById('cfgKeepAlive')?.checked !== false,
    autoReconnect: document.getElementById('cfgAutoReconnect')?.checked,
    strictHost: document.getElementById('cfgStrictHostKey')?.checked,
    verbose: document.getElementById('cfgVerbose')?.checked,
  };
}

function buildDockerCommand(s) {
  return `docker run --rm -i alpine/openssh-client ssh \\\n  -p ${s.info.ssh_port} -R0:127.0.0.1:${s.port} \\\n  -o StrictHostKeyChecking=no ${s.keepAlive ? '-o ServerAliveInterval=30 ' : ''}\\\n  ${s.token}@ssh.iraglobaltech.com`;
}

function buildConfigCommand() {
  const s = builderState();
  if (!s.info) return '';
  if (cmdTab === 'docker') return buildDockerCommand(s);
  let cmd = 'ssh';
  if (s.verbose) cmd += ' -v';
  cmd += ` -p ${s.info.ssh_port}`;
  cmd += ` -R0:127.0.0.1:${s.port}`;
  if (s.keepAlive) cmd += ' -o ServerAliveInterval=30';
  if (!s.strictHost) cmd += ' -o StrictHostKeyChecking=no';
  cmd += ` ${s.token}@ssh.iraglobaltech.com`;
  return cmd;
}

function downloadCommand(kind) {
  const s = builderState();
  const cmd = buildConfigCommand();
  let content, filename;
  if (kind === 'bat') {
    content = `@echo off\r\nREM Tunnel startup script (Windows)\r\n${cmd}\r\npause\r\n`;
    filename = 'start-tunnel.bat';
  } else {
    const inner = s.autoReconnect
      ? `while true; do\n  ${cmd}\n  echo "Tunnel dropped — reconnecting in 3s..."\n  sleep 3\ndone`
      : cmd;
    content = `#!/bin/sh\n# Tunnel startup script (generated)\n${inner}\n`;
    filename = kind === 'command' ? 'start-tunnel.command' : 'start-tunnel.sh';
  }
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded ' + filename);
}

async function showQr() {
  const url = document.getElementById('cfgUrl')?.textContent;
  if (!url || url.includes('—')) { toast('Start a tunnel first (URL unknown)', 'error'); return; }
  try {
    const res = await fetch(`${API}/tunnels/qr?text=${encodeURIComponent(url)}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
    if (!res.ok) throw new Error('QR failed');
    const svg = await res.text();
    const box = document.getElementById('qrBox');
    document.getElementById('qrImg').src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    box.style.display = 'block';
  } catch (e) { toast(e.message, 'error'); }
}

async function loadSavedConfigs() {
  try {
    const list = await api('/configs');
    const sel = document.getElementById('cfgSavedList');
    if (!sel) return;
    sel.innerHTML = '<option value="">📂 Load saved…</option>' +
      list.map(x => `<option value='${JSON.stringify(x.config).replace(/'/g, "&#39;")}' data-id="${x.id}">${x.name}</option>`).join('');
    sel.onchange = () => {
      if (!sel.value) return;
      try {
        const cfg = JSON.parse(sel.value);
        if (cfg.local_addr) document.getElementById('cfgLocalAddr').value = cfg.local_addr;
        if (cfg.platform) document.getElementById('cfgPlatform').value = cfg.platform;
        if (cfg.keep_alive !== undefined) document.getElementById('cfgKeepAlive').checked = cfg.keep_alive;
        if (cfg.auto_reconnect !== undefined) document.getElementById('cfgAutoReconnect').checked = cfg.auto_reconnect;
        if (cfg.strict_host !== undefined) document.getElementById('cfgStrictHostKey').checked = cfg.strict_host;
        if (cfg.verbose !== undefined) document.getElementById('cfgVerbose').checked = cfg.verbose;
        updateCfgCommand();
        toast('Configuration loaded');
      } catch (e) { toast('Could not load config', 'error'); }
      sel.value = '';
    };
  } catch (e) { /* silent */ }
}

function updateCfgCommand() {
  const el = document.getElementById('cfgCommand');
  if (el) el.textContent = buildConfigCommand();

  // Update URL preview
  const tokenSelect = document.getElementById('cfgToken');
  const urlEl = document.getElementById('cfgUrl');
  if (tokenSelect && urlEl) {
    const token = tokenSelect.value;
    import_hash = (s => { let h=0; for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0; return Math.abs(h).toString(16).substring(0,7); })(token);
    // Use MD5-like hash for display
    let hash = 0;
    for (let i = 0; i < token.length; i++) { hash = ((hash << 5) - hash + token.charCodeAt(i)) | 0; }
    const sub = Math.abs(hash).toString(16).substring(0, 7).padStart(7, '0');
    urlEl.textContent = `https://${sub}.iraglobaltech.com`;
  }

  // Update platform hint
  const platform = document.getElementById('cfgPlatform')?.value || 'windows';
  const hint = document.getElementById('cfgPlatformHint');
  if (hint) {
    const hints = {
      windows: 'Open Command Prompt (CMD) and paste the following command:',
      linux: 'Open terminal and paste the following command:',
      mac: 'Open Terminal and paste the following command:'
    };
    hint.textContent = hints[platform];
  }
}

async function loadTunnels() {
  const c = document.getElementById('pageContent');
  c.innerHTML = '<div class="card"><div class="card-body"><p class="empty">Loading...</p></div></div>';
  try {
    const tunnels = await api('/tunnels/my');
    const now = Date.now();
    let rows = tunnels.map((t, i) => {
      const urlCell = t.custom_url
        ? `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a><br><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-size:.8rem;font-weight:600">${t.custom_url}</a></td>`
        : `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a></td>`;
      // Calculate KB/s for this tunnel
      const tunnelId = t.id || t.subdomain;
      let kbps = '—';
      if (tunnelRateTracker[tunnelId]) {
        const prev = tunnelRateTracker[tunnelId];
        const bytesDelta = (t.bytes_transferred || 0) - prev.lastBytes;
        const timeDeltaMs = now - prev.lastTime;
        if (timeDeltaMs > 0) {
          const kbpsDelta = (bytesDelta / 1024) / (timeDeltaMs / 1000);
          kbps = kbpsDelta.toFixed(2);
        }
      }
      tunnelRateTracker[tunnelId] = { lastBytes: t.bytes_transferred || 0, lastTime: now };
      return `<tr>
      <td>${i + 1}</td>
      ${urlCell}
      <td class="code">${t.subdomain}</td>
      <td>${t.request_count}</td>
      <td>${(t.bytes_transferred / 1024).toFixed(1)} KB</td>
      <td>${kbps} KB/s</td>
      <td><span class="badge badge-green">${t.status}</span></td>
      <td>${t.created_at.replace('T',' ').substring(0,19)}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="openDebugger('${t.subdomain}')" title="Inspect captured requests">🔍 Debug</button></td>
    </tr>`;
    }).join('');
    if (!rows) rows = '<tr><td colspan="9" class="empty">No active tunnels. Start a tunnel from the Quickstart page.</td></tr>';
    c.innerHTML = `
    <h2 style="margin-bottom:1rem">Active Tunnels</h2>
    <p style="color:var(--text-dim);margin-bottom:1.5rem;font-size:.9rem">${tunnels.length} active session${tunnels.length !== 1 ? 's' : ''}</p>
    <div class="card">
      <div class="card-body" style="padding:0;overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>Tunnel URL</th><th>Subdomain</th><th>Requests</th><th>Data</th><th>Transfer Rate</th><th>Status</th><th>Created</th><th>Inspector</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

function switchTokenOs(os, btn) {
  document.querySelectorAll('#tokenOsTabs .os-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (window._tokenSshConfig) window._tokenSshConfig.os = os;
  const hint = document.getElementById('tokenOsHint');
  const commandTitle = document.getElementById('tokenCmdTitle');
  const windowsCommand = document.getElementById('tokenWindowsCmdWrap');
  if (os === 'windows') {
    hint.innerHTML = 'Open <strong>PowerShell</strong> and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this PowerShell command';
    if (windowsCommand) windowsCommand.style.display = 'block';
  } else if (os === 'linux') {
    hint.innerHTML = 'Open your <strong>terminal</strong> (Ctrl+Alt+T) and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this Terminal command';
    if (windowsCommand) windowsCommand.style.display = 'none';
  } else {
    hint.innerHTML = 'Open <strong>Terminal</strong> (Cmd+Space → "Terminal") and paste the command above.';
    if (commandTitle) commandTitle.textContent = 'Run this Terminal command';
    if (windowsCommand) windowsCommand.style.display = 'none';
  }
  updateTokenCmd();
}

function updateTokenCmd() {
  const port = document.getElementById('tokenLocalPort').value || '8080';
  const config = window._tokenSshConfig;
  if (!config) return;
  const ssh = `ssh -p ${config.sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${config.token}@ssh.iraglobaltech.com`;
  let command = ssh;
  if (document.getElementById('tokenAutoReconnect')?.checked) {
    if (config.os === 'windows') {
      command = `while ($true) { ${ssh}; Write-Host "Disconnected. Reconnecting in 5 seconds..."; Start-Sleep -Seconds 5 }`;
    } else {
      command = `while true; do\n  ${ssh}\n  echo "Disconnected. Reconnecting in 5 seconds..."\n  sleep 5\ndone`;
    }
  }
  document.getElementById('tokenSshCmd').textContent = command;
  const windowsCommand = `ssh -p ${config.sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${config.token}@ssh.iraglobaltech.com`;
  const windowsCommandEl = document.getElementById('tokenWindowsCmd');
  if (windowsCommandEl) windowsCommandEl.textContent = windowsCommand;
}

async function editToken(tokenId, currentName, currentDomain) {
  // fetch current security settings
  let sec = { basic_auth_user: '', ip_whitelist: '', bearer_key: '', https_only: false };
  let curSub = '';
  try {
    const list = await api('/tokens');
    const t = list.find(x => x.id === tokenId);
    if (t) { curSub = t.fixed_subdomain || ''; if (t.security) sec = { ...t.security, basic_auth_user: t.security.basic_auth_user || '' }; }
  } catch (e) {}
  showModal('Edit Token', `
    <div class="form-group">
      <label>Token name</label>
      <input type="text" id="editTokenName" value="${currentName}">
    </div>
    <div class="form-group">
      <label>Custom domain (leave empty for none)</label>
      <input type="text" id="editTokenDomain" value="${currentDomain}" placeholder="e.g. serverira.com">
    </div>
    <div class="form-group">
      <label>Fixed subdomain — your permanent URL (empty = random each connect)</label>
      <input type="text" id="editFixedSub" value="${curSub}" placeholder="myapi">
    </div>
    <div class="form-row" style="display:grid;grid-template-columns:110px 1fr;gap:.6rem">
      <div class="form-group">
        <label>Tunnel type</label>
        <select id="editTunnelMode">
          <option value="http">HTTP</option>
          <option value="tcp">TCP (Pro)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Persistent TCP port (Pro — the public port stays yours)</label>
        <input type="number" id="editTcpPort" min="1024" max="65535" placeholder="e.g. 15000">
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin:.75rem 0;padding-top:.75rem">
      <strong style="font-size:.85rem">🔒 Security</strong>
      <div class="form-group" style="margin-top:.5rem">
        <label>Basic auth — username:password (empty = off)</label>
        <input type="text" id="editBasicUser" value="${(sec.basic_auth_user || '')}" placeholder="admin" style="margin-bottom:.3rem">
        <input type="password" id="editBasicPass" placeholder="${sec.basic_auth_user ? '(unchanged — type to change)' : 'password'}">
      </div>
      <div class="form-group">
        <label>IP whitelist (comma-separated IPs/CIDRs, empty = allow all)</label>
        <input type="text" id="editIpWhitelist" value="${(sec.ip_whitelist || '')}" placeholder="203.0.113.5, 10.0.0.0/8">
      </div>
      <div class="form-group">
        <label>API key required on requests (empty = off, "auto" = generate)</label>
        <input type="text" id="editBearerKey" placeholder="${sec.bearer_key ? '(key set — hidden)' : 'auto'}">
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;cursor:pointer">
        <input type="checkbox" id="editHttpsOnly" ${sec.https_only ? 'checked' : ''} style="width:auto">
        HTTPS only (reject plain HTTP requests)
      </label>
    </div>
  `, async () => {
    const name = document.getElementById('editTokenName').value.trim();
    const domain = document.getElementById('editTokenDomain').value.trim();
    const newSub = document.getElementById('editFixedSub').value.trim().toLowerCase();
    const payload = { name, custom_domain: domain };
    if (newSub !== curSub) payload.fixed_subdomain = newSub;
    const mode = document.getElementById('editTunnelMode')?.value;
    const tcpPort = parseInt(document.getElementById('editTcpPort')?.value);
    if (mode === 'tcp') { payload.tunnel_mode = 'tcp'; if (tcpPort) payload.tcp_port = tcpPort; }
    else if (mode === 'http') { payload.tunnel_mode = 'http'; }
    const bu = document.getElementById('editBasicUser').value.trim();
    const bp = document.getElementById('editBasicPass').value;
    if (bu || bp) { payload.basic_auth_user = bu; payload.basic_auth_pass = bp || undefined; }
    const wl = document.getElementById('editIpWhitelist').value.trim();
    if (wl !== (sec.ip_whitelist || '')) payload.ip_whitelist = wl;
    const bk = document.getElementById('editBearerKey').value.trim();
    if (bk) payload.bearer_key = bk;
    if (document.getElementById('editHttpsOnly').checked !== !!sec.https_only)
      payload.https_only = document.getElementById('editHttpsOnly').checked;
    try {
      closeModal();
      await api(`/tokens/${tokenId}`, 'PUT', payload);
      toast('Token updated');
      loadTokens();
    } catch (e) { toast(e.message, 'error'); }
  });
}

function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm', confirmClass = '') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const confirmBtn = document.getElementById('modalConfirm');
  confirmBtn.textContent = confirmText;
  confirmBtn.className = 'btn btn-sm ' + confirmClass;
  confirmBtn.onclick = onConfirm;
  document.getElementById('modalOverlay').style.display = 'flex';

  setTimeout(() => {

    if (firstInput) firstInput.focus();

        <input type="radio" name="payMethod" value="paypal" style="width:auto">

          <strong>PayPal</strong>

async function startCheckout(method) {
  try {
    toast('Creating payment...');
    const resp = await api('/payments/checkout', 'POST', JSON.stringify({ method, plan: 'pro', seats: proSeats || 1, cycle: billingCycle || 'monthly' }));
    if (resp.url) {
      window.location.href = resp.url;
    } else {
      toast('No payment URL returned', 'error');
    }
  } catch (e) { toast(e.message, 'error'); }
}

function downgradeModal() {
  showModal('Downgrade to Free', `
    <p style="font-size:.875rem;color:var(--text-dim);line-height:1.6">
      Are you sure you want to downgrade to <strong style="color:var(--text)">Free</strong>?
    </p>
    <div style="margin-top:.75rem;padding:.75rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:.825rem;color:var(--text-dim)">
      You will lose: persistent tunnels, fixed subdomains, custom domain.<br>
      Free limits: 1 tunnel · 60-minute timeout · random subdomain.
    </div>
    <p style="font-size:.78rem;color:var(--text-dim);margin-top:.6rem">Note: an admin will process your downgrade. Your Pro stays active until then.</p>
  `, () => {
    closeModal();
    toast('Downgrade requested — contact support or admin to process', 'success');
  }, 'Request Downgrade', 'btn-danger');
}

// ---- Tunnel helpers ----
function buildSSHCommand() {
  const info = tunnelState.info;
  if (!info) return '';
  if (!tunnelState.token) return 'Create a token first in Manage Tokens →';
  const port = tunnelState.localPort;
  const token = tunnelState.token;
  const sshPort = info.ssh_port;
  const sshHost = info.domain.includes('iraglobaltech.com') ? 'ssh.iraglobaltech.com' : info.domain;
  const ssh = `ssh -p ${sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${token}@${sshHost}`;
  if (!document.getElementById('autoReconnectInput')?.checked) return ssh;
  const os = tunnelState.os || 'cmd';
  if (os === 'cmd') {
    return `for /L %i in (0,1,2147483647) do @(${ssh} & echo Disconnected. Reconnecting in 5 seconds... & timeout /t 5 /nobreak >nul)`;
  }
  if (os === 'powershell') {
    return `while ($true) { ${ssh}; Write-Host "Disconnected. Reconnecting in 5 seconds..."; Start-Sleep -Seconds 5 }`;
  }
  return `while true; do\n  ${ssh}\n  echo "Disconnected. Reconnecting in 5 seconds..."\n  sleep 5\ndone`;
}

function updateSSHCommand() {
  const el = document.getElementById('sshCommand');
  if (el) el.textContent = buildSSHCommand();
}

function updateLocalPort(port) {
  tunnelState.localPort = parseInt(port) || 8080;
  updateSSHCommand();
}

function switchOS(os, el) {
  document.querySelectorAll('#osTabs .os-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  tunnelState.os = os;
  const hint = document.getElementById('osHint');
  if (hint) {
    const hints = {
      cmd: 'Open Command Prompt (CMD) and paste the following command:',
      powershell: 'Open PowerShell and paste the following command:',
      linux: 'Open your terminal (Ctrl+Alt+T) and paste the following command:',
      mac: 'Open Terminal (Cmd+Space → "Terminal") and paste the following command:'
    };
    hint.textContent = hints[os] || hints.cmd;
  }
  updateSSHCommand();
}

// ---- Polling ----
function startTunnelPolling() {
  stopTunnelPolling();
  tunnelPollTimer = setInterval(async () => {
    if (!document.getElementById('sshCommand')) return;
    try {
      const tunnels = await api('/tunnels/my');
      updateTunnelBanner(tunnels);
      updateTunnelTable(tunnels);
    } catch {}
  }, 5000);
}

function stopTunnelPolling() {
  if (tunnelPollTimer) { clearInterval(tunnelPollTimer); tunnelPollTimer = null; }
}

function updateTunnelBanner(tunnels) {
  const banner = document.getElementById('tunnelBanner');
  if (!banner) return;
  if (tunnels.length > 0) {
    const t = tunnels[0];
    banner.style.display = 'block';
    banner.className = 'tunnel-banner';
    const customUrlHtml = t.custom_url
      ? `<div style="margin-top:.25rem"><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-weight:600;font-size:.95rem">${t.custom_url}</a> <button class="btn btn-sm" style="padding:.2rem .5rem;font-size:.75rem" onclick="copyToClipboard('${t.custom_url}')">📋</button></div>`
      : '';
    banner.innerHTML = `
      <div class="dot"></div>
      <div style="flex:1">
        <div style="font-weight:700;font-size:1.1rem;color:var(--primary)">Tunnel Active!</div>
        <div style="font-size:.9rem;color:var(--text-dim)">Your tunnel URL:</div>
        ${customUrlHtml}
      </div>
      <a href="${t.url}" target="_blank" class="url">${t.url}</a>
      <button class="btn btn-sm" onclick="copyToClipboard('${t.url}')">📋 Copy</button>`;
  } else {
    banner.style.display = 'none';
  }
}

function updateTunnelTable(tunnels) {
  const tbody = document.getElementById('tunnelTableBody');
  const countEl = document.getElementById('tunnelCount');
  if (!tbody) return;
  if (countEl) countEl.textContent = tunnels.length;
  if (tunnels.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No active tunnels yet. Use the command above to create one.</td></tr>';
    return;
  }
  const now = Date.now();
  tbody.innerHTML = tunnels.map(t => {
    const urlCell = t.custom_url
      ? `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a><br><a href="${t.custom_url}" target="_blank" style="color:var(--green);font-size:.8rem;font-weight:600">${t.custom_url}</a></td>`
      : `<td><a href="${t.url}" target="_blank" style="color:var(--primary);font-weight:600">${t.url}</a></td>`;
    // Calculate KB/s for this tunnel
    const tunnelId = t.id || t.subdomain;
    let kbps = '—';
    if (tunnelRateTracker[tunnelId]) {
      const prev = tunnelRateTracker[tunnelId];
      const bytesDelta = (t.bytes_transferred || 0) - prev.lastBytes;
      const timeDeltaMs = now - prev.lastTime;
      if (timeDeltaMs > 0) {
        const kbpsDelta = (bytesDelta / 1024) / (timeDeltaMs / 1000);
        kbps = kbpsDelta.toFixed(2);
      }
    }
    tunnelRateTracker[tunnelId] = { lastBytes: t.bytes_transferred || 0, lastTime: now };
    return `<tr>
    ${urlCell}
    <td class="code">${t.subdomain}</td>
    <td>${t.request_count}</td>
    <td>${(t.bytes_transferred / 1024).toFixed(1)} KB</td>
    <td>${kbps} KB/s</td>
    <td><span class="badge badge-green">${t.status}</span></td>
    <td>${t.created_at.replace('T',' ').substring(0,19)}</td>
  </tr>`;
  }).join('');
}

// ---- Custom Domain ----
async function saveMyCustomDomain(clear) {
  const input = document.getElementById('myCustomDomain') || document.getElementById('domainInput');
  const domain = clear ? '' : input.value.trim();
  if (!clear && !domain) { toast('Enter a domain first', 'error'); return; }
  if (!clear && domain) {
    const cd = domain.toLowerCase();
    if (cd.endsWith('.iraglobaltech.com') || cd === 'iraglobaltech.com') {
      const allowed = (currentUser.role === 'admin') || (currentUser.email === 'support@iraglobaltech.com');
      if (!allowed) { toast('Subdomains of iraglobaltech.com can only be set by admin or support.', 'error'); return; }
    }
  }
  try {
    await api(`/users/me/custom-domain?custom_domain=${encodeURIComponent(domain)}`, 'PUT');
    toast(clear ? 'Custom domain cleared' : 'Custom domain saved');
    if (clear) input.value = '';
    loadQuickstart();
  } catch (e) { toast(e.message, 'error'); }
}

// ---- Clipboard helpers ----
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch { toast('Copy failed', 'error'); }
    document.body.removeChild(ta);
  });
}
function copyToken() { copyToClipboard(tunnelState.token); }
function copySSHCmd() { copyToClipboard(buildSSHCommand()); }
function copyCfgCmd() { copyToClipboard(buildSSHCommand()); }
function toggleTokenVisibility() {
  const el = document.getElementById('accessToken');
  if (el) { el.type = el.type === 'password' ? 'text' : 'password'; }
}

// ---- Init ----
async function checkAuth() {
  if (!authToken) {
    window.location.replace('/login');
    return false;
  }
  try {
    const resp = await fetch('/api/v1/auth/me', { headers: { 'Authorization': `Bearer ${authToken}` } });
    if (!resp.ok) throw new Error('Token expired');
    currentUser = await resp.json();
    return true;
  } catch {
    localStorage.removeItem('pinggy_token');
    authToken = '';
    window.location.replace('/login');
    return false;
  }
}

// Detect back/forward navigation (bfcache) — immediately hide and check auth
window.addEventListener('pageshow', (event) => {
  if (event.persisted || (performance && performance.getEntriesByType && performance.getEntriesByType('navigation').some(n => n.type === 'back_forward'))) {
    // Page restored from bfcache — immediately hide ALL content synchronously
    if (!localStorage.getItem('pinggy_token')) {
      document.documentElement.style.visibility = 'hidden';
      window.location.replace('/login');
    } else {
      checkAuth();
    }
  }
});

(async function init() {
  if (await checkAuth()) {
    showApp();
  }
})();
</script>
