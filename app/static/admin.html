<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pinggy Admin</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
    --border: #475569; --text: #f1f5f9; --text-dim: #94a3b8;
    --primary: #3b82f6; --primary-hover: #2563eb; --green: #22c55e;
    --red: #ef4444; --amber: #f59e0b; --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--primary); text-decoration: none; }

  /* ---- Login ---- */
  #loginView { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 360px; }
  .login-card h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  .login-card p { color: var(--text-dim); font-size: .85rem; margin-bottom: 1.5rem; }

  /* ---- Layout ---- */
  #appView { display: none; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 1.25rem; }
  .topbar .right { display: flex; align-items: center; gap: 1rem; }
  .topbar .user-info { color: var(--text-dim); font-size: .85rem; }

  .layout { display: flex; min-height: calc(100vh - 57px); }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }
  .sidebar a { display: block; padding: .65rem 1.5rem; color: var(--text-dim); font-size: .9rem; border-left: 3px solid transparent; transition: .15s; }
  .sidebar a:hover { background: var(--surface2); color: var(--text); }
  .sidebar a.active { color: var(--primary); border-left-color: var(--primary); background: var(--surface2); }
  .content { flex: 1; padding: 1.5rem; overflow-y: auto; }

  /* ---- Forms ---- */
  label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: .3rem; }
  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .form-group { margin-bottom: 1rem; }
  .form-row { display: flex; gap: 1rem; }
  .form-row .form-group { flex: 1; }

  /* ---- Buttons ---- */
  .btn { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: .55rem 1.25rem; font-size: .9rem; cursor: pointer; transition: .15s; }
  .btn:hover { background: var(--primary-hover); }
  .btn-sm { padding: .3rem .7rem; font-size: .8rem; }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #dc2626; }
  .btn-ghost { background: var(--surface2); }
  .btn-ghost:hover { background: var(--border); }

  /* ---- Cards / Tables ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.5rem; }
  .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-header h2 { font-size: 1.1rem; }
  .card-body { padding: 1.25rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .65rem 1rem; border-bottom: 1px solid var(--border); font-size: .85rem; }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: .75rem; letter-spacing: .03em; }
  tr:hover td { background: var(--surface2); }
  .badge { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
  .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-red { background: rgba(239,68,68,.15); color: var(--red); }

  /* ---- Toast ---- */
  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem 1.25rem; font-size: .85rem; display: none; z-index: 999; }
  #toast.show { display: block; animation: slideIn .3s; }
  #toast.success { border-color: var(--green); }
  #toast.error { border-color: var(--red); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .empty { text-align: center; color: var(--text-dim); padding: 2rem; }
  .code { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .8rem; color: var(--text-dim); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .stat-card .label { font-size: .75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .stat-card .value { font-size: 1.75rem; font-weight: 700; margin-top: .25rem; }

  /* ---- Timeline (pinggy.io style) ---- */
  .timeline { position: relative; padding-left: 3rem; }
  .timeline::before { content: ''; position: absolute; left: 1rem; top: 1rem; bottom: 1rem; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 1.5rem; }
  .tl-bullet { position: absolute; left: calc(-3rem + 1rem - 1rem); top: 0; width: 2rem; height: 2rem; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700; z-index: 1; }
  .tl-title h3 { font-size: 1.1rem; margin-bottom: .15rem; }
  .tl-title p { font-size: .85rem; color: var(--text-dim); margin-bottom: .5rem; }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-top: .5rem; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .tab { padding: .5rem 1rem; cursor: pointer; color: var(--text-dim); font-size: .85rem; border-bottom: 2px solid transparent; transition: .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---- OS tabs ---- */
  .os-tabs { display: flex; gap: .25rem; margin-bottom: .75rem; }
  .os-tab { display: flex; align-items: center; gap: .35rem; padding: .4rem .8rem; cursor: pointer; color: var(--text-dim); font-size: .8rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); transition: .15s; }
  .os-tab:hover { color: var(--text); border-color: var(--primary); }
  .os-tab.active { color: var(--primary); border-color: var(--primary); background: rgba(59,130,246,.1); }
  .os-tab svg { width: 16px; height: 16px; }

  /* ---- Command box ---- */
  .cmd-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem 1rem; display: flex; align-items: center; gap: .5rem; }
  .cmd-box pre { flex: 1; font-family: 'Cascadia Code','Fira Code',monospace; font-size: .85rem; color: var(--text); white-space: pre-wrap; word-break: break-all; margin: 0; }
  .cmd-box .copy-btn { flex-shrink: 0; }

  /* ---- Token field ---- */
  .token-row { display: flex; align-items: center; gap: .5rem; }
  .token-row input { flex: 1; font-family: 'Cascadia Code','Fira Code',monospace; font-size: .85rem; }
  .token-row .icon-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: .15s; }
  .token-row .icon-btn:hover { color: var(--text); border-color: var(--primary); }
  .token-row .icon-btn svg { width: 16px; height: 16px; }

  /* ---- App selector ---- */
  .app-select-wrap { position: relative; }
  .app-select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; cursor: pointer; appearance: none; }
  .app-select:focus { border-color: var(--primary); }

  /* ---- Switch toggle ---- */
  .switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; gap: .5rem; }
  .switch input { display: none; }
  .switch .track { width: 36px; height: 20px; background: var(--surface2); border-radius: 10px; position: relative; transition: .2s; border: 1px solid var(--border); }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--text-dim); border-radius: 50%; transition: .2s; }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track .thumb { left: 18px; background: #fff; }
  .switch label { font-size: .85rem; color: var(--text); cursor: pointer; }

  /* ---- Integration grid ---- */
  .int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .int-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; gap: 1rem; align-items: center; cursor: pointer; transition: .15s; }
  .int-card:hover { border-color: var(--primary); background: var(--surface2); }
  .int-card .int-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; background: var(--bg); }
  .int-card .int-info h4 { font-size: .9rem; margin-bottom: .15rem; }
  .int-card .int-info p { font-size: .75rem; color: var(--text-dim); line-height: 1.3; }

  /* ---- Search input ---- */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-wrap input { padding-left: 2rem; }
  .search-wrap .search-icon { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

  /* ---- Protocol select ---- */
  .proto-select { width: 110px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; cursor: pointer; appearance: none; }
  .addr-row { display: flex; gap: .5rem; align-items: flex-start; }
  .addr-row input { flex: 1; }
</style>
</head>
<body>

<!-- Loading screen (shown while checking auth) -->
<div id="loadingScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="text-align:center">
    <div style="font-size:1.5rem;font-weight:800;margin-bottom:1rem">⚡ Tunnel Admin</div>
    <div style="color:var(--text-dim);font-size:.875rem">Loading...</div>
  </div>
</div>

<!-- ============ LOGIN VIEW (hidden — auth is on /login page) ============ -->
<div id="loginView" style="display:none">
  <div class="login-card">
    <h1>pinggy Admin</h1>
    <p>Sign in with your account</p>
    <div id="loginError" style="color:var(--red);font-size:.8rem;margin-bottom:.75rem;display:none;"></div>
    <div class="form-group">
      <label>Email / Username</label>
      <input type="text" id="loginEmail" placeholder="admin" value="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" value="admin">
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    <p style="margin-top:.75rem;font-size:.75rem;color:var(--text-dim);text-align:center">Default: <strong>admin</strong> / <strong>admin</strong> (change after first login)</p>
  </div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="appView">
  <div class="topbar">
    <h1>⚡ pinggy Admin</h1>
    <div class="right">
      <span class="user-info" id="topbarUser"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <a href="#" class="active" data-page="dashboard" onclick="navigate('dashboard', this)">📊 Dashboard</a>
      <a href="#" data-page="users" onclick="navigate('users', this)" id="navUsers" style="display:none">👥 Users</a>
      <a href="#" data-page="tokens" onclick="navigate('tokens', this)" id="navTokens" style="display:none">🔑 All Tokens</a>
      <a href="#" data-page="tunnels" onclick="navigate('tunnels', this)" id="navTunnels" style="display:none">🔗 All Tunnels</a>
      <a href="#" data-page="payments" onclick="navigate('payments', this)" id="navPayments" style="display:none">💳 Payments</a>
      <a href="#" data-page="ipmonitor" onclick="navigate('ipmonitor', this)" id="navIpMonitor" style="display:none">🛡️ IP Monitor</a>
      <a href="#" data-page="audit" onclick="navigate('audit', this)" id="navAudit" style="display:none">📋 Audit Log</a>
      <a href="#" data-page="settings" onclick="navigate('settings', this)" id="navSettings" style="display:none">⚙️ Settings</a>
      <a href="#" data-page="coupons" onclick="navigate('coupons', this)" id="navCoupons" style="display:none">🎟️ Coupons</a>
      <a href="#" data-page="register" onclick="navigate('register', this)" id="navRegister" style="display:none">➕ Add User</a>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Modal Dialog -->
<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:400px;margin:1rem">
    <h3 id="modalTitle" style="font-size:1.1rem;font-weight:700;margin-bottom:1rem"></h3>
    <div id="modalBody"></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-sm" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('pinggy_token');
let currentUser = null;

// ---- Toast ----
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3000);
}

// ---- API helper ----
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Authorization': `Bearer ${token}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(`${API}${path}`, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

// ---- Auth ----
async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    localStorage.setItem('pinggy_token', token);
    currentUser = data.user;
    showApp();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout() {
  token = null; currentUser = null;
  localStorage.removeItem('pinggy_token');
  window.location.href = '/login';
}

async function showApp() {
  if (!token) { window.location.href = '/login'; return; }
  try {
    currentUser = await api('/auth/me');
  } catch {
    logout(); return;
  }
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('topbarUser').textContent = `${currentUser.email} (${currentUser.role})`;
  // Show admin-only nav links
  if (currentUser.role === 'admin') {
    document.getElementById('navUsers').style.display = 'block';
    document.getElementById('navTokens').style.display = 'block';
    document.getElementById('navTunnels').style.display = 'block';
    document.getElementById('navPayments').style.display = 'block';
    document.getElementById('navIpMonitor').style.display = 'block';
    document.getElementById('navAudit').style.display = 'block';
    document.getElementById('navSettings').style.display = 'block';
    document.getElementById('navCoupons').style.display = 'block';
    document.getElementById('navRegister').style.display = 'block';
  }
  navigate('dashboard', document.querySelector('.sidebar a'));
}

// ---- Navigation ----
function navigate(page, el) {
  stopTunnelPolling();
  stopIpMonitorPolling();
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  const c = document.getElementById('pageContent');
  if (page === 'dashboard') { c.innerHTML = renderDashboard(); loadAdminStats(); loadSystemInfo(); loadInsights(); }
  else if (page === 'users') loadUsers();
  else if (page === 'tokens') loadAllTokens();
  else if (page === 'tunnels') loadAllTunnels();
  else if (page === 'payments') loadAllPayments();
  else if (page === 'ipmonitor') loadIpMonitor();
  else if (page === 'audit') loadAuditLog();
  else if (page === 'settings') loadSettings();
  else if (page === 'coupons') loadCoupons();
  else if (page === 'register') c.innerHTML = renderRegisterForm();
}

// ---- Dashboard ----
function renderDashboard() {
  const isAdmin = currentUser.role === 'admin';
  const adminCards = isAdmin ? `
    <div class="card">
      <div class="card-header"><h2>Quick Actions</h2></div>
      <div class="card-body" style="display:flex;gap:.75rem;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="navigate('users', document.querySelector('[data-page=users]'))">View Users</button>
        <button class="btn btn-sm" onclick="navigate('tokens', document.querySelector('[data-page=tokens]'))">View Tokens</button>
        <button class="btn btn-sm" onclick="navigate('tunnels', document.querySelector('[data-page=tunnels]'))">View Tunnels</button>
        <button class="btn btn-sm" onclick="navigate('payments', document.querySelector('[data-page=payments]'))">View Payments</button>
        <button class="btn btn-sm" onclick="navigate('register', document.querySelector('[data-page=register]'))">Add User</button>
      </div>
    </div>` : '';
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Logged in as</div><div class="value" style="font-size:1rem">${currentUser.email}</div></div>
      <div class="stat-card"><div class="label">User ID</div><div class="value code" style="font-size:.8rem">${currentUser.id}</div></div>
      <div class="stat-card"><div class="label">Full Name</div><div class="value" style="font-size:1rem">${currentUser.full_name || '—'}</div></div>
      <div class="stat-card"><div class="label">Role</div><div class="value" style="font-size:1rem"><span class="badge ${currentUser.role === 'admin' ? 'badge-green' : 'badge-red'}">${currentUser.role}</span></div></div>
    </div>
    <div id="adminStats" style="margin-bottom:1.5rem"></div>
    ${adminCards}
    <div class="card" style="margin-top:1.5rem">
      <div class="card-header"><h2>📈 Insights (Daily / Monthly)</h2>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-sm" id="insRangeBtn" onclick="cycleInsightsRange()">📅 30d</button>
          <button class="btn btn-sm" onclick="loadInsights()">🔄 Refresh</button>
        </div>
      </div>
      <div class="card-body" id="insightsBody"><p class="empty">Loading insights…</p></div>
    </div>
    <div id="recentActivity" style="margin-top:1.5rem"></div>
    <div class="card">
      <div class="card-header"><h2>System Info</h2></div>
      <div class="card-body">
        <table>
          <tr><td>API Base</td><td class="code">${API}</td></tr>
          <tr><td>Swagger Docs</td><td><a href="/docs" target="_blank">/docs</a></td></tr>
          <tr><td>ReDoc</td><td><a href="/redoc" target="_blank">/redoc</a></td></tr>
          <tr><td>Health Check</td><td><a href="/health" target="_blank">/health</a></td></tr>
          <tr><td>SSH Server</td><td class="code" id="sysSshServer">—</td></tr>
          <tr><td>Tunnel Domain</td><td class="code" id="sysTunnelDomain">—</td></tr>
        </table>
      </div>
    </div>`;
}

// ---- Insights (Job 7): dependency-free bar charts ----
let insightsState = { range: 30, tab: 'daily', data: null };

function cycleInsightsRange() {
  insightsState.range = insightsState.range === 30 ? 60 : insightsState.range === 60 ? 90 : 30;
  loadInsights();
}

async function loadInsights() {
  const btn = document.getElementById('insRangeBtn');
  if (btn) btn.textContent = `📅 ${insightsState.range}d`;
  try {
    insightsState.data = await api(`/analytics/overview?days=${insightsState.range}`);
    renderInsights();
  } catch (e) {
    const el = document.getElementById('insightsBody');
    if (el) el.innerHTML = `<p style="color:var(--red)">${e.message}</p>`;
  }
}

function barChart(title, points, fmt = v => v) {
  // points: [{label, value}] — renders vertical bars with max-height scaling
  const max = Math.max(1, ...points.map(p => p.value));
  const bars = points.map(p => `
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.25rem" title="${esc(p.label)}: ${fmt(p.value)}">
      <div style="width:70%;height:${Math.max(2, Math.round((p.value / max) * 90))}px;background:var(--primary);border-radius:3px 3px 0 0;opacity:.85"></div>
      <div style="font-size:.6rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(p.label)}</div>
    </div>`).join('');
  return `<div style="margin-bottom:1rem">
    <div style="font-size:.8rem;font-weight:600;margin-bottom:.4rem">${title} <span style="color:var(--text-dim);font-weight:400">(max ${fmt(max)})</span></div>
    <div style="display:flex;align-items:flex-end;gap:2px;height:110px">${bars}</div>
  </div>`;
}

function renderInsights() {
  const el = document.getElementById('insightsBody');
  if (!el || !insightsState.data) return;
  const d = insightsState.data;
  const s = d.summary;
  let charts = '';
  if (insightsState.tab === 'daily') {

    charts = barChart('Signups / month', pts('signups'))
           + barChart('Tunnels created / month', pts('tunnels'))
           + barChart('Tunnel requests / month', pts('requests'))
           + barChart('Revenue / month (₹)', pts('revenue'), v => '₹' + v);

    const hostOnly = domain.split(':')[0];
    // Same derivation as buildSSHCommand(): prod uses a DNS-only ssh.<domain> host

    if (d) d.textContent = domain;

}

async function stopTunnel(subdomain) {
  showModal('Stop Tunnel', `<p style="font-size:.875rem;color:var(--text-dim);line-height:1.5">Stop tunnel <strong style="color:var(--text)">${subdomain}</strong>? This will disconnect the user's SSH session immediately.</p>`, async () => {
    try {
      closeModal();
      await api(`/tunnels/${subdomain}/stop`, 'POST');
      toast('Tunnel stopped');
      const activeLink = document.querySelector('.sidebar a.active');
      if (activeLink) navigate(activeLink.dataset.page, activeLink);
    } catch (e) { toast(e.message, 'error'); }
  }, 'Stop', 'btn-danger');
}

async function deleteUser(userId, email) {
  showModal('Delete User', `<p style="font-size:.875rem;color:var(--text-dim);line-height:1.5">Delete user <strong style="color:var(--text)">${email}</strong>? This will remove all their tunnels and tokens. This cannot be undone.</p>`, async () => {
    try {
      closeModal();
      await api(`/users/${userId}`, 'DELETE');
      toast('User deleted');
      loadUsers();
    } catch (e) { toast(e.message, 'error'); }
  }, 'Delete', 'btn-danger');
}

// ---- Edit user (email / name / role / password reset) ----
async function editUser(id) {
  let u;
  try {
    const users = await api('/users?limit=500');
    u = users.find(x => x.id === id);
  } catch (e) { toast(e.message, 'error'); return; }
  if (!u) { toast('User not found', 'error'); return; }
  showModal(`Edit User — ${esc(u.email)}`, `
    <div class="form-group"><label>Email</label><input type="text" id="editEmail" value="${esc(u.email || '')}"></div>
    <div class="form-group"><label>Full Name</label><input type="text" id="editFullName" value="${esc(u.full_name || '')}"></div>
    <div class="form-group"><label>Role</label>
      <select id="editRole" style="width:100%;padding:.4rem .5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text)">
        <option value="user" ${u.role !== 'admin' ? 'selected' : ''}>user</option>
        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
      </select></div>
    <div class="form-group"><label>New Password</label><input type="text" id="editPassword" autocomplete="off" placeholder="(leave blank to keep current)"></div>
    <p style="font-size:.75rem;color:var(--text-dim)">Changing the email re-links their tokens automatically is NOT supported yet — tokens rows keep the old email (SSH auth for those tokens will fail until re-created).</p>
  `, async () => {
    try {
      const email = document.getElementById('editEmail').value.trim();
      const full_name = document.getElementById('editFullName').value.trim();
      const role = document.getElementById('editRole').value;
      const password = document.getElementById('editPassword').value;
      const params = new URLSearchParams();
      if (email && email !== u.email) params.set('email', email);
      if (full_name !== (u.full_name || '')) params.set('full_name', full_name);
      if (role !== u.role) params.set('role', role);
      if (password) params.set('password', password);
      if (![...params.keys()].length) { closeModal(); toast('No changes'); return; }
      await api(`/users/${id}?${params.toString()}`, 'PUT');
      closeModal();
      toast('User updated');
      loadUsers();
    } catch (e) { toast(e.message, 'error'); }
  }, 'Save Changes');
}

// ---- Enable / disable account access ----
function setUserActive(id, email, active) {
  showModal(active ? 'Enable Account' : 'Disable Account', `<p style="font-size:.875rem;color:var(--text-dim);line-height:1.5">${active ? 'Re-enable' : 'Disable'} account access for <strong style="color:var(--text)">${esc(email)}</strong>?<br>${active ? 'They will be able to log in and open tunnels again.' : 'Their login, API tokens and SSH tunnels will be rejected immediately.'}</p>`, async () => {
    try {
      closeModal();
      await api(`/users/${id}?is_active=${active}`, 'PUT');
      toast(active ? 'Account enabled' : 'Account disabled');
      loadUsers();
    } catch (e) { toast(e.message, 'error'); }
  }, active ? 'Enable' : 'Disable', active ? '' : 'btn-danger');
}

// ---- Modal helpers ----
function showModal(title, bodyHtml, onConfirm, confirmText = 'Confirm', confirmClass = '') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const confirmBtn = document.getElementById('modalConfirm');
  confirmBtn.textContent = confirmText;
  confirmBtn.className = 'btn btn-sm ' + confirmClass;
  confirmBtn.onclick = onConfirm;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    const totByt = tokens.reduce((s, t) => s + (t.total_bytes || 0), 0);
    const fmtData = b => b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : (b/1024).toFixed(1)+' KB';
    let rows = tokens.map((t, i) => `<tr>
      <td>${i + 1}</td>
      <td class="code">${t.token}</td>
      <td>${t.name || '—'}</td>

      <td class="code">${t.subdomain}</td>

              <input type="text" data-setting-key="${s.key}" value="${esc(s.value)}" placeholder="${s.is_secret ? '(unchanged — enter new value to replace)' : ''}" style="flex:1" ${s.is_secret && s.is_set ? 'autocomplete="off"' : ''}>

      <div class="card">

            <button class="btn btn-sm btn-ghost" onclick="loadSettings()">🔄 Refresh</button>
          </div>
        </div>
        <div class="card-body">
          <p style="font-size:.78rem;color:var(--text-dim);margin-bottom:1rem">Secrets are masked (sk_1••••abc). Leave a field empty to keep the stored value; type a new value to replace it. Changes apply immediately (no server restart). Non-secret fields (prices, URLs, toggles) always save what you type. Toggles accept true/false.</p>
          ${html}

async function saveSettings() {
  const inputs = document.querySelectorAll('[data-setting-key]');
  const values = {};
  inputs.forEach(i => { if (i.value.trim() !== '') values[i.dataset.settingKey] = i.value.trim(); });
  if (!Object.keys(values).length) { toast('No changes (empty fields keep stored values)'); return; }
  try {
    await api('/settings', 'PUT', { values });
    toast(`Saved ${Object.keys(values).length} setting(s)`);
    loadSettings();
  } catch (e) { toast(e.message, 'error'); }
}

// ---- IP Monitor ----
let ipMonitorState = { tab: 'live', limit: 100, searchQuery: '' };
let ipMonitorPollTimer = null;

function startIpMonitorPolling() {
  stopIpMonitorPolling();
  ipMonitorPollTimer = setInterval(async () => {
    if (!document.getElementById('ipMonitorStats')) return;
    try {
      const stats = await api('/ip-monitor/stats');
      updateIpMonitorStats(stats);
      // Refresh IP list if on live tab
      if (ipMonitorState.tab === 'live') {
        const data = await api(`/ip-monitor/ips?limit=${ipMonitorState.limit}`);
        renderIpList(data.ips || []);
      }
    } catch {}
  }, 5000);
}

function stopIpMonitorPolling() {
  if (ipMonitorPollTimer) { clearInterval(ipMonitorPollTimer); ipMonitorPollTimer = null; }
}

async function loadIpMonitor() {
  stopIpMonitorPolling();
  const c = document.getElementById('pageContent');
  c.innerHTML = '<div class="card"><div class="card-body"><p class="empty">Loading...</p></div></div>';
  try {
    const [stats, config] = await Promise.all([api('/ip-monitor/stats'), api('/ip-monitor/config')]);
    const blocked = await api('/ip-monitor/blocked');
    const ips = await api(`/ip-monitor/ips?limit=${ipMonitorState.limit}`);

    c.innerHTML = renderIpMonitorLayout(stats, config, blocked.blocked || [], ips.ips || []);
    startIpMonitorPolling();
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

function renderIpMonitorLayout(stats, config, blockedIps, ips) {
  const enabled = stats.enabled !== false;
  if (!enabled) {
    return `<div class="card"><div class="card-body"><p class="empty">⚠️ Redis is not connected. IP monitoring is disabled.<br><br>Install Redis and set <code>REDIS_ENABLED=true</code> in .env to enable.</p></div></div>`;
  }

  let countryRows = '';
  if (stats.top_countries && stats.top_countries.length > 0) {
    countryRows = stats.top_countries.map(([country, count]) =>
      `<tr><td>${country || 'Unknown'}</td><td>${count}</td></tr>`).join('');
  } else {
    countryRows = '<tr><td colspan="2" class="empty">No geo data yet</td></tr>';
  }

  let blockedRows = blockedIps.map(b => `<tr>
    <td class="code">${b.ip}</td>
    <td><span class="badge badge-red">${b.reason || 'manual'}</span></td>
    <td>${b.blocked_at ? b.blocked_at.replace('T',' ').substring(0,19) : '—'}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="unblockIp('${b.ip}')">Unblock</button></td>
  </tr>`).join('');
  if (!blockedRows) blockedRows = '<tr><td colspan="4" class="empty">No blocked IPs</td></tr>';

  return `
  <div class="stat-grid" id="ipMonitorStats">
    <div class="stat-card"><div class="label">Tracked IPs</div><div class="value">${stats.tracked_ips || 0}</div></div>
    <div class="stat-card"><div class="label">Blocked IPs</div><div class="value" style="color:var(--red)">${stats.blocked_ips || 0}</div></div>
    <div class="stat-card"><div class="label">Rate Window</div><div class="value" style="font-size:1rem">${config.rate_window_seconds || 60}s</div></div>
    <div class="stat-card"><div class="label">Block Threshold</div><div class="value" style="font-size:1rem">${config.block_threshold || 500} req</div></div>
  </div>

  <div class="card">
    <div class="card-header"><h2>🛡️ IP Monitor</h2>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input type="text" id="ipSearchInput" placeholder="Search IP..." value="${ipMonitorState.searchQuery}"
          style="width:180px;padding:.3rem .6rem;font-size:.8rem"
          oninput="ipMonitorState.searchQuery=this.value;filterIpList()">
        <button class="btn btn-sm" onclick="loadIpMonitor()">🔄 Refresh</button>
      </div>
    </div>
    <div class="card-body">
      <div class="tabs">
        <button class="tab ${ipMonitorState.tab === 'live' ? 'active' : ''}" onclick="switchIpTab('live',this)">📡 Live IPs (${ips.length})</button>
        <button class="tab ${ipMonitorState.tab === 'blocked' ? 'active' : ''}" onclick="switchIpTab('blocked',this)">🚫 Blocked (${blockedIps.length})</button>
        <button class="tab ${ipMonitorState.tab === 'countries' ? 'active' : ''}" onclick="switchIpTab('countries',this)">🌍 Countries</button>
        <button class="tab ${ipMonitorState.tab === 'config' ? 'active' : ''}" onclick="switchIpTab('config',this)">⚙️ Config</button>
      </div>

      <div class="tab-panel" id="ipTabLive" style="display:${ipMonitorState.tab === 'live' ? 'block' : 'none'}">
        <div style="margin-bottom:.75rem;display:flex;gap:.5rem;align-items:center">
          <label style="font-size:.8rem;color:var(--text-dim);white-space:nowrap">Limit:</label>
          <select id="ipLimitSelect" onchange="ipMonitorState.limit=this.value;loadIpMonitor()" style="width:100px;padding:.3rem .5rem;font-size:.8rem">
            <option value="50" ${ipMonitorState.limit==50?'selected':''}>50</option>
            <option value="100" ${ipMonitorState.limit==100?'selected':''}>100</option>

          </tr></thead><tbody id="ipLiveBody">${renderIpListRows(ips)}</tbody></table>

            <div class="form-group"><label>Block threshold (requests per window)</label><input type="number" id="cfgBlockThreshold" value="${config.block_threshold || 500}" min="10" max="1000000"></div>

function renderIpListRows(ips) {
  let rows = ips.map(ip => {
    const tunnels = (ip.tunnels || []).join(', ') || '—';
    const status = ip.blocked
      ? '<span class="badge badge-red">Blocked</span>'
      : (ip.window_count > 100 ? '<span class="badge" style="background:rgba(245,158,11,.15);color:var(--amber)">High</span>' : '<span class="badge badge-green">Active</span>');
    return `<tr class="ip-row" data-ip="${ip.ip}">
      <td class="code">${ip.ip}</td>
      <td>${ip.country || '—'}</td>
      <td>${ip.city || '—'}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ip.isp || '—'}</td>
      <td>${ip.total_requests || 0}</td>
      <td>${ip.window_count || 0}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${tunnels}">${tunnels}</td>
      <td>${ip.last_seen ? ip.last_seen.replace('T',' ').substring(0,19) : '—'}</td>
      <td>${status}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="viewIpDetails('${ip.ip}')">View</button>
        ${!ip.blocked ? `<button class="btn btn-sm btn-danger" onclick="blockIpFromList('${ip.ip}')">Block</button>` : `<button class="btn btn-sm btn-ghost" onclick="unblockIp('${ip.ip}')">Unblock</button>`}
      </td>
    </tr>`;
  }).join('');
  if (!rows) rows = '<tr><td colspan="10" class="empty">No IPs tracked yet</td></tr>';
  return rows;
}

function renderIpList(ips) {
  const tbody = document.getElementById('ipLiveBody');
  if (!tbody) return;
  tbody.innerHTML = renderIpListRows(ips);
  filterIpList();
}

async function saveIpConfig() {
  try {
    const body = {
      auto_block_enabled: document.getElementById('cfgAutoBlock').checked,
      rate_window_seconds: parseInt(document.getElementById('cfgRateWindow').value) || 60,
      block_threshold: parseInt(document.getElementById('cfgBlockThreshold').value) || 500,
      block_duration_seconds: parseInt(document.getElementById('cfgBlockDuration').value) || 3600,
    };
    await api('/ip-monitor/config', 'PUT', body);
    toast('IP monitor settings saved');
    loadIpMonitor();
  } catch (e) { toast(e.message, 'error'); }
}

function filterIpList() {
  const q = ipMonitorState.searchQuery.toLowerCase();
  document.querySelectorAll('.ip-row').forEach(row => {
    const ip = (row.dataset.ip || '').toLowerCase();
    row.style.display = (!q || ip.includes(q)) ? '' : 'none';
  });
}

function updateIpMonitorStats(stats) {
  const el = document.getElementById('ipMonitorStats');
  if (!el) return;
  const cards = el.querySelectorAll('.stat-card');
  if (cards.length >= 2) {
    cards[0].querySelector('.value').textContent = stats.tracked_ips || 0;
    cards[1].querySelector('.value').textContent = stats.blocked_ips || 0;
  }
}

function switchIpTab(tab, el) {
  ipMonitorState.tab = tab;
  document.querySelectorAll('.card .tabs .tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  const panelMap = { live: 'ipTabLive', blocked: 'ipTabBlocked', countries: 'ipTabCountries', config: 'ipTabConfig' };
  const panel = document.getElementById(panelMap[tab]);
  if (panel) panel.style.display = 'block';
}

async function viewIpDetails(ip) {
  try {
    const info = await api(`/ip-monitor/ips/${encodeURIComponent(ip)}`);
    const tunnels = (info.tunnels || []).join(', ') || 'None';
    const statusBadge = info.blocked
      ? '<span class="badge badge-red">Blocked</span>'
      : '<span class="badge badge-green">Active</span>';
    showModal(`IP Details: ${ip}`, `
      <table style="width:100%">
        <tr><td style="width:140px">IP</td><td class="code"><strong>${info.ip}</strong></td></tr>
        <tr><td>Status</td><td>${statusBadge}</td></tr>
        <tr><td>Total Requests</td><td>${info.total_requests || 0}</td></tr>
        <tr><td>Window Count</td><td>${info.window_count || 0}</td></tr>
        <tr><td>Country</td><td>${info.country || '—'} ${info.country_code ? '('+info.country_code+')' : ''}</td></tr>
        <tr><td>City</td><td>${info.city || '—'}</td></tr>
        <tr><td>ISP</td><td>${info.isp || '—'}</td></tr>
        <tr><td>Lat/Lon</td><td>${info.lat || '—'}, ${info.lon || '—'}</td></tr>
        <tr><td>User Agent</td><td style="font-size:.75rem;color:var(--text-dim);word-break:break-all">${info.user_agent || '—'}</td></tr>
        <tr><td>Last Path</td><td class="code">${info.last_path || '—'}</td></tr>
        <tr><td>Last Status</td><td>${info.last_status || '—'}</td></tr>
        <tr><td>Last Seen</td><td>${info.last_seen ? info.last_seen.replace('T',' ').substring(0,19) : '—'}</td></tr>
        <tr><td>Tunnels Visited</td><td style="word-break:break-all">${tunnels}</td></tr>
      </table>
    `, async () => {
      closeModal();
    }, 'Close', 'btn-ghost');
    document.getElementById('modalConfirm').onclick = closeModal;
  } catch (e) { toast(e.message, 'error'); }
}

function showBlockIpModal() {
  showModal('Block IP Address', `
    <div class="form-group"><label>IP Address</label><input type="text" id="blockIpInput" placeholder="1.2.3.4"></div>
    <div class="form-group"><label>Reason</label>
      <select id="blockReasonSelect" style="width:100%">
        <option value="manual">Manual</option>
        <option value="ddos">DDoS Attack</option>
        <option value="scanning">Port Scanning</option>
        <option value="brute_force">Brute Force</option>
        <option value="suspicious">Suspicious Activity</option>
      </select>
    </div>
    <div class="form-group"><label>Duration (seconds)</label>
      <select id="blockDurationSelect" style="width:100%">
        <option value="3600">1 hour</option>
        <option value="21600">6 hours</option>
        <option value="86400">24 hours</option>
        <option value="604800">7 days</option>
        <option value="0">Permanent</option>
      </select>
    </div>
  `, async () => {
    const ip = document.getElementById('blockIpInput').value.trim();
    const reason = document.getElementById('blockReasonSelect').value;
    const duration = parseInt(document.getElementById('blockDurationSelect').value);
    if (!ip) { toast('Enter an IP address', 'error'); return; }
    try {
      closeModal();
      await api('/ip-monitor/block', 'POST', { ip, reason, duration: duration || 999999999 });
      toast(`IP ${ip} blocked`);
      loadIpMonitor();
    } catch (e) { toast(e.message, 'error'); }
  }, 'Block', 'btn-danger');
}

async function blockIpFromList(ip) {
  showModal('Block IP', `<p style="font-size:.875rem;color:var(--text-dim)">Block <strong style="color:var(--text)">${ip}</strong> for 1 hour?</p>`, async () => {
    try {
      closeModal();
      await api('/ip-monitor/block', 'POST', { ip, reason: 'manual', duration: 3600 });
      toast(`IP ${ip} blocked`);
      loadIpMonitor();
    } catch (e) { toast(e.message, 'error'); }
  }, 'Block', 'btn-danger');
}

async function unblockIp(ip) {
  showModal('Unblock IP', `<p style="font-size:.875rem;color:var(--text-dim)">Unblock <strong style="color:var(--text)">${ip}</strong>?</p>`, async () => {
    try {
      closeModal();
      await api('/ip-monitor/unblock', 'POST', { ip });
      toast(`IP ${ip} unblocked`);
      loadIpMonitor();
    } catch (e) { toast(e.message, 'error'); }
  }, 'Unblock', '');
}

async function doRegister() {
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const full_name = document.getElementById('regFullName').value || null;
  const role = document.getElementById('regRole').value;
  try {
    const res = await fetch(`${API}/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ email, password, full_name, role })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Registration failed');
    toast(`User ${email} created successfully`);
    navigate('users', document.querySelector('[data-page=users]'));

function startTunnelPolling() {
  stopTunnelPolling();
  tunnelPollTimer = setInterval(async () => {
    // Only poll if on My Tunnels page
    if (!document.getElementById('sshCommand')) return;
    try {
      const tunnels = await api('/tunnels/my');
      updateTunnelBanner(tunnels);
      updateTunnelTable(tunnels);
    } catch {}
  }, 3000); // Check every 3 seconds
}

function stopTunnelPolling() {
  if (tunnelPollTimer) { clearInterval(tunnelPollTimer); tunnelPollTimer = null; }
}

function updateTunnelBanner(tunnels) {
  const banner = document.getElementById('tunnelBanner');
  if (!banner) return;
  if (tunnels.length > 0) {
    const t = tunnels[0];
    banner.style.display = 'block';
    banner.innerHTML = `
      <div style="display:flex;align-items:center;gap:1rem">

function updateTunnelTable(tunnels) {
  const tbody = document.getElementById('tunnelTableBody');

            <span style="font-size:.8rem;color:var(--text-dim)">The port your local service runs on</span>

          <p style="font-size:.85rem;color:var(--text-dim);margin-bottom:.5rem" id="osHint">Open terminal and paste the following command:</p>
          <div class="cmd-box">
            <pre id="sshCommand">${buildSSHCommand()}</pre>
            <button class="btn btn-sm copy-btn" onclick="copySSHCmd()">📋 Copy</button>
          </div>
        </div>
      </div>

      <!-- Step 3: Quick reference -->
      <div class="tl-item">
        <div class="tl-bullet">3</div>
        <div class="tl-title">
          <h3>Quick Reference</h3>
          <p>Alternative SSH command format</p>
        </div>
        <div class="tl-card">
          <p style="font-size:.85rem;margin-bottom:.5rem">Open your terminal and run:</p>
          <div class="cmd-box"><pre>ssh -p ${info.ssh_port} -R0:127.0.0.1:8000 ${info.domain}</pre><button class="btn btn-sm" onclick="copyToClipboard('ssh -p ${info.ssh_port} -R0:127.0.0.1:8000 ${info.domain}')">📋</button></div>
          <p style="margin-top:.5rem;font-size:.8rem;color:var(--text-dim)">Replace <span style="color:var(--primary)">8000</span> with the port where your service is running.</p>
        </div>
      </div>
    </div>

    <!-- Active tunnel banner (auto-updates) -->
    <div id="tunnelBanner" style="display:none;margin-top:1.5rem;padding:1rem 1.5rem;background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(34,197,94,.05));border:1px solid rgba(34,197,94,.3);border-radius:var(--radius)"></div>

    <!-- Active tunnels table -->
    <div class="card" style="margin-top:1.5rem">
      <div class="card-header"><h2>🔗 My Active Tunnels (<span id="tunnelCount">${tunnels.length}</span>)</h2><button class="btn btn-sm" onclick="loadMyTunnels()">🔄 Refresh</button></div>
      <div class="card-body" style="padding:0;overflow-x:auto">
        <table><thead><tr><th>Tunnel URL</th><th>Subdomain</th><th>Requests</th><th>Data</th><th>Status</th><th>Created</th></tr></thead><tbody id="tunnelTableBody">${tunnelRows}</tbody></table>
      </div>
    </div>`;
    // Apply current state
    updateSSHCommand();
    // Show banner if tunnels exist
    updateTunnelBanner(tunnels);
    // Start auto-polling for new tunnels
    startTunnelPolling();
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

// ---- Timeline helpers ----
function buildSSHCommand() {
  const info = tunnelState.info;
  if (!info) return '';
  const port = tunnelState.localPort;
  const token = tunnelState.token;
  const domain = info.domain;
  const sshPort = info.ssh_port;
  // Use ssh.iraglobaltech.com for SSH connection (DNS-only, bypasses Cloudflare)
  // Tunnel URLs still use the domain (e.g. https://abc123.iraglobaltech.com)
  const sshHost = domain.includes('iraglobaltech.com') ? 'ssh.iraglobaltech.com' : domain;
  return `ssh -p ${sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${token}@${sshHost}`;
}

function updateSSHCommand() {
  const el = document.getElementById('sshCommand');
  if (el) el.textContent = buildSSHCommand();
}

function updateLocalPort(port) {
  tunnelState.localPort = parseInt(port) || 8080;
  updateSSHCommand();
}

function switchOS(os, el) {
  document.querySelectorAll('#osTabs .os-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  tunnelState.os = os;
  const hints = {
    mac: 'Open terminal and paste the following command:',
    linux: 'Open a terminal and paste the following command:',
    windows: 'Open Command Prompt (CMD) and paste the following command:',
  };
  document.getElementById('osHint').textContent = hints[os];
}

function copySSHCmd() {
  copyToClipboard(buildSSHCommand());
}

function copyToken() {
  copyToClipboard(tunnelState.token);
}

function toggleTokenVisibility() {
  const el = document.getElementById('accessToken');
  tunnelState.tokenVisible = !tunnelState.tokenVisible;
  if (tunnelState.tokenVisible) {
    el.value = tunnelState.token;
    el.removeAttribute('type');
  } else {
    el.value = tunnelState.token.substring(0, 4) + '••••••••';
  }
}



function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard!')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Copied to clipboard!'); } catch (e) { toast('Copy failed', 'error'); }
  document.body.removeChild(ta);
}

// ---- API Explorer ----
function renderApiExplorer() {
  const endpoints = [
    { method: 'GET',    path: '/health',              auth: false, desc: 'Health check' },
    { method: 'POST',   path: '/auth/login',           auth: false, desc: 'Login, get JWT token' },
    { method: 'POST',   path: '/auth/register',       auth: true,  desc: 'Create user (admin only)' },
    { method: 'GET',    path: '/auth/me',              auth: true,  desc: 'Get current user' },
    { method: 'GET',    path: '/auth/tunnel-token',    auth: true,  desc: 'Get your tunnel token' },
    { method: 'POST',   path: '/auth/regenerate-token', auth: true, desc: 'Regenerate your tunnel token' },
    { method: 'GET',    path: '/users',                auth: true,  desc: 'List all users (admin only)' },
    { method: 'GET',    path: '/users/{user_id}',      auth: true,  desc: 'Get user by ID (admin only)' },
    { method: 'PUT',    path: '/users/{user_id}',      auth: true,  desc: 'Update user — email, name, role, password (admin only)' },
    { method: 'DELETE', path: '/users/{user_id}',     auth: true,  desc: 'Delete user (admin only)' },
    { method: 'GET',    path: '/users/{user_id}/tunnels', auth: true, desc: 'Get tunnels for a user (admin only)' },
    { method: 'GET',    path: '/tunnels/info',         auth: true,  desc: 'SSH connection info' },
    { method: 'GET',    path: '/tunnels/my',           auth: true,  desc: 'My active tunnels' },
    { method: 'GET',    path: '/tunnels',              auth: true,  desc: 'List all active tunnels (admin only)' },
    { method: 'GET',    path: '/tunnels/history',      auth: true,  desc: 'Tunnel history from DB (admin only)' },
    { method: 'GET',    path: '/tunnels/stats',        auth: true,  desc: 'Dashboard stats — users, tunnels, requests (admin only)' },
    { method: 'DELETE', path: '/tunnels/{subdomain}',  auth: true,  desc: 'Force-stop a tunnel (admin only)' },
    { method: 'POST',   path: '/tunnels/{subdomain}/stop', auth: true, desc: 'Stop your own tunnel' },
  ];
  let rows = endpoints.map(e => `<tr>
    <td><span class="badge ${e.auth ? 'badge-green' : 'badge-red'}">${e.method}</span></td>
    <td class="code">${e.path}</td>
    <td>${e.auth ? '🔒 JWT' : '—'}</td>
    <td>${e.desc}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="tryEndpoint('${e.method}','${e.path}',${e.auth})">Try</button></td>
  </tr>`).join('');
  return `<div class="card">
    <div class="card-header"><h2>API Explorer</h2></div>
    <div class="card-body" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Method</th><th>Path</th><th>Auth</th><th>Description</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>
  <div class="card" id="tryCard" style="display:none">
    <div class="card-header"><h2 id="tryTitle"></h2><button class="btn btn-ghost btn-sm" onclick="document.getElementById('tryCard').style.display='none'">Close</button></div>
    <div class="card-body">
      <div class="form-group"><label>Path (edit {user_id} etc.)</label><input type="text" id="tryPath"></div>
      <div class="form-group" id="tryBodyGroup" style="display:none"><label>Request Body (JSON)</label><textarea id="tryBody" rows="5" placeholder='{"email":"...","password":"..."}'></textarea></div>
      <button class="btn" onclick="executeTry()">Send Request</button>
      <div style="margin-top:1rem"><label>Response</label><pre id="tryResult" class="code" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;max-height:300px;overflow:auto;white-space:pre-wrap"></pre></div>
    </div>
  </div>`;
}

let currentTry = {};
function tryEndpoint(method, path, needsAuth) {
  currentTry = { method, needsAuth };
  document.getElementById('tryCard').style.display = 'block';
  document.getElementById('tryTitle').textContent = `${method} ${path}`;
  document.getElementById('tryPath').value = path;
  document.getElementById('tryBodyGroup').style.display = (method === 'POST') ? 'block' : 'none';
  if (method === 'POST' && path === '/auth/register') {
    document.getElementById('tryBody').value = JSON.stringify({ email: 'newuser', password: 'password123', full_name: 'New User', role: 'user' }, null, 2);
  } else if (method === 'POST' && path === '/auth/login') {
    document.getElementById('tryBody').value = JSON.stringify({ email: 'admin', password: 'admin' }, null, 2);
  } else {
    document.getElementById('tryBody').value = '';
  }
  document.getElementById('tryResult').textContent = '';
}

async function executeTry() {
  const path = document.getElementById('tryPath').value;
  const body = document.getElementById('tryBody').value;
  const resultEl = document.getElementById('tryResult');
  resultEl.textContent = 'Sending...';
  try {
    const opts = { method: currentTry.method, headers: {} };
    if (currentTry.needsAuth) opts.headers['Authorization'] = `Bearer ${token}`;
    if (currentTry.method === 'POST' && body) { opts.headers['Content-Type'] = 'application/json'; opts.body = body; }
    const res = await fetch(`${API}${path}`, opts);
    const text = await res.text();
    let formatted = text;
    try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    resultEl.textContent = `Status: ${res.status} ${res.statusText}\n\n${formatted}`;
  } catch (e) { resultEl.textContent = `Error: ${e.message}`; }
}

// ---- Init ----
// Detect back/forward navigation (bfcache) — immediately hide and redirect
window.addEventListener('pageshow', (event) => {
  if (event.persisted || (performance && performance.getEntriesByType && performance.getEntriesByType('navigation').some(n => n.type === 'back_forward'))) {
    if (!localStorage.getItem('pinggy_token')) {
      // Immediately hide ALL content synchronously before redirect
      document.documentElement.style.visibility = 'hidden';
      window.location.replace('/login');
    }
  }
});

if (token) {
  showApp();
} else {
  window.location.replace('/login');
}
</script>
