<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pinggy Admin</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
    --border: #475569; --text: #f1f5f9; --text-dim: #94a3b8;
    --primary: #3b82f6; --primary-hover: #2563eb; --green: #22c55e;
    --red: #ef4444; --amber: #f59e0b; --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--primary); text-decoration: none; }

  /* ---- Login ---- */
  #loginView { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 360px; }
  .login-card h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  .login-card p { color: var(--text-dim); font-size: .85rem; margin-bottom: 1.5rem; }

  /* ---- Layout ---- */
  #appView { display: none; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 1.25rem; }
  .topbar .right { display: flex; align-items: center; gap: 1rem; }
  .topbar .user-info { color: var(--text-dim); font-size: .85rem; }

  .layout { display: flex; min-height: calc(100vh - 57px); }
  .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 1rem 0; flex-shrink: 0; }
  .sidebar a { display: block; padding: .65rem 1.5rem; color: var(--text-dim); font-size: .9rem; border-left: 3px solid transparent; transition: .15s; }
  .sidebar a:hover { background: var(--surface2); color: var(--text); }
  .sidebar a.active { color: var(--primary); border-left-color: var(--primary); background: var(--surface2); }
  .content { flex: 1; padding: 1.5rem; overflow-y: auto; }

  /* ---- Forms ---- */
  label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: .3rem; }
  input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .form-group { margin-bottom: 1rem; }
  .form-row { display: flex; gap: 1rem; }
  .form-row .form-group { flex: 1; }

  /* ---- Buttons ---- */
  .btn { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: .55rem 1.25rem; font-size: .9rem; cursor: pointer; transition: .15s; }
  .btn:hover { background: var(--primary-hover); }
  .btn-sm { padding: .3rem .7rem; font-size: .8rem; }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #dc2626; }
  .btn-ghost { background: var(--surface2); }
  .btn-ghost:hover { background: var(--border); }

  /* ---- Cards / Tables ---- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.5rem; }
  .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-header h2 { font-size: 1.1rem; }
  .card-body { padding: 1.25rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .65rem 1rem; border-bottom: 1px solid var(--border); font-size: .85rem; }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: .75rem; letter-spacing: .03em; }
  tr:hover td { background: var(--surface2); }
  .badge { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
  .badge-green { background: rgba(34,197,94,.15); color: var(--green); }
  .badge-red { background: rgba(239,68,68,.15); color: var(--red); }

  /* ---- Toast ---- */
  #toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem 1.25rem; font-size: .85rem; display: none; z-index: 999; }
  #toast.show { display: block; animation: slideIn .3s; }
  #toast.success { border-color: var(--green); }
  #toast.error { border-color: var(--red); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .empty { text-align: center; color: var(--text-dim); padding: 2rem; }
  .code { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: .8rem; color: var(--text-dim); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .stat-card .label { font-size: .75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .stat-card .value { font-size: 1.75rem; font-weight: 700; margin-top: .25rem; }

  /* ---- Timeline (pinggy.io style) ---- */
  .timeline { position: relative; padding-left: 3rem; }
  .timeline::before { content: ''; position: absolute; left: 1rem; top: 1rem; bottom: 1rem; width: 2px; background: var(--border); }
  .tl-item { position: relative; margin-bottom: 1.5rem; }
  .tl-bullet { position: absolute; left: calc(-3rem + 1rem - 1rem); top: 0; width: 2rem; height: 2rem; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700; z-index: 1; }
  .tl-title h3 { font-size: 1.1rem; margin-bottom: .15rem; }
  .tl-title p { font-size: .85rem; color: var(--text-dim); margin-bottom: .5rem; }
  .tl-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-top: .5rem; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .tab { padding: .5rem 1rem; cursor: pointer; color: var(--text-dim); font-size: .85rem; border-bottom: 2px solid transparent; transition: .15s; background: none; border-top: none; border-left: none; border-right: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ---- OS tabs ---- */
  .os-tabs { display: flex; gap: .25rem; margin-bottom: .75rem; }
  .os-tab { display: flex; align-items: center; gap: .35rem; padding: .4rem .8rem; cursor: pointer; color: var(--text-dim); font-size: .8rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); transition: .15s; }
  .os-tab:hover { color: var(--text); border-color: var(--primary); }
  .os-tab.active { color: var(--primary); border-color: var(--primary); background: rgba(59,130,246,.1); }
  .os-tab svg { width: 16px; height: 16px; }

  /* ---- Command box ---- */
  .cmd-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem 1rem; display: flex; align-items: center; gap: .5rem; }
  .cmd-box pre { flex: 1; font-family: 'Cascadia Code','Fira Code',monospace; font-size: .85rem; color: var(--text); white-space: pre-wrap; word-break: break-all; margin: 0; }
  .cmd-box .copy-btn { flex-shrink: 0; }

  /* ---- Token field ---- */
  .token-row { display: flex; align-items: center; gap: .5rem; }
  .token-row input { flex: 1; font-family: 'Cascadia Code','Fira Code',monospace; font-size: .85rem; }
  .token-row .icon-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: .15s; }
  .token-row .icon-btn:hover { color: var(--text); border-color: var(--primary); }
  .token-row .icon-btn svg { width: 16px; height: 16px; }

  /* ---- App selector ---- */
  .app-select-wrap { position: relative; }
  .app-select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; cursor: pointer; appearance: none; }
  .app-select:focus { border-color: var(--primary); }

  /* ---- Switch toggle ---- */
  .switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; gap: .5rem; }
  .switch input { display: none; }
  .switch .track { width: 36px; height: 20px; background: var(--surface2); border-radius: 10px; position: relative; transition: .2s; border: 1px solid var(--border); }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--text-dim); border-radius: 50%; transition: .2s; }
  .switch input:checked + .track { background: var(--primary); }
  .switch input:checked + .track .thumb { left: 18px; background: #fff; }
  .switch label { font-size: .85rem; color: var(--text); cursor: pointer; }

  /* ---- Integration grid ---- */
  .int-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .int-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; gap: 1rem; align-items: center; cursor: pointer; transition: .15s; }
  .int-card:hover { border-color: var(--primary); background: var(--surface2); }
  .int-card .int-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; background: var(--bg); }
  .int-card .int-info h4 { font-size: .9rem; margin-bottom: .15rem; }
  .int-card .int-info p { font-size: .75rem; color: var(--text-dim); line-height: 1.3; }

  /* ---- Search input ---- */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-wrap input { padding-left: 2rem; }
  .search-wrap .search-icon { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

  /* ---- Protocol select ---- */
  .proto-select { width: 110px; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; cursor: pointer; appearance: none; }
  .addr-row { display: flex; gap: .5rem; align-items: flex-start; }
  .addr-row input { flex: 1; }
</style>
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<div id="loginView">
  <div class="login-card">
    <h1>pinggy Admin</h1>
    <p>Sign in with your account</p>
    <div id="loginError" style="color:var(--red);font-size:.8rem;margin-bottom:.75rem;display:none;"></div>
    <div class="form-group">
      <label>Email / Username</label>
      <input type="text" id="loginEmail" placeholder="admin" value="admin">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" value="admin">
    </div>
    <button class="btn" style="width:100%" onclick="doLogin()">Login</button>
    <p style="margin-top:.75rem;font-size:.75rem;color:var(--text-dim);text-align:center">Default: <strong>admin</strong> / <strong>admin</strong> (change after first login)</p>
  </div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="appView">
  <div class="topbar">
    <h1>⚡ pinggy Admin</h1>
    <div class="right">
      <span class="user-info" id="topbarUser"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <a href="#" class="active" data-page="dashboard" onclick="navigate('dashboard', this)">📊 Dashboard</a>
      <a href="#" data-page="mytunnels" onclick="navigate('mytunnels', this)">🔗 My Tunnels</a>
      <a href="#" data-page="users" onclick="navigate('users', this)" id="navUsers" style="display:none">👥 Users</a>
      <a href="#" data-page="register" onclick="navigate('register', this)" id="navRegister" style="display:none">➕ Add User</a>
      <a href="#" data-page="api" onclick="navigate('api', this)" id="navApi" style="display:none">🔌 API Explorer</a>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('admin_token');
let currentUser = null;

// ---- Toast ----
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3000);
}

// ---- API helper ----
async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { 'Authorization': `Bearer ${token}` } };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(`${API}${path}`, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
  return data;
}

// ---- Auth ----
async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    localStorage.setItem('admin_token', token);
    currentUser = data.user;
    showApp();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout() {
  token = null; currentUser = null;
  localStorage.removeItem('admin_token');
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
}

async function showApp() {
  if (!token) { document.getElementById('loginView').style.display = 'flex'; return; }
  try {
    currentUser = await api('/auth/me');
  } catch {
    logout(); return;
  }
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('topbarUser').textContent = `${currentUser.email} (${currentUser.role})`;
  // Show admin-only nav links
  if (currentUser.role === 'admin') {
    document.getElementById('navUsers').style.display = 'block';
    document.getElementById('navRegister').style.display = 'block';
    document.getElementById('navApi').style.display = 'block';
  }
  navigate('dashboard', document.querySelector('.sidebar a'));
}

// ---- Navigation ----
function navigate(page, el) {
  stopTunnelPolling();
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  if (el) el.classList.add('active');
  const c = document.getElementById('pageContent');
  if (page === 'dashboard') c.innerHTML = renderDashboard();
  else if (page === 'mytunnels') loadMyTunnels();
  else if (page === 'users') loadUsers();
  else if (page === 'register') c.innerHTML = renderRegisterForm();
  else if (page === 'api') c.innerHTML = renderApiExplorer();
}

// ---- Dashboard ----
function renderDashboard() {
  const isAdmin = currentUser.role === 'admin';
  const adminCards = isAdmin ? `
    <div class="card">
      <div class="card-header"><h2>Quick Actions</h2></div>
      <div class="card-body" style="display:flex;gap:.75rem;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="navigate('users', document.querySelector('[data-page=users]'))">View Users</button>
        <button class="btn btn-sm" onclick="navigate('register', document.querySelector('[data-page=register]'))">Add User</button>
        <button class="btn btn-sm" onclick="navigate('api', document.querySelector('[data-page=api]'))">API Explorer</button>
      </div>
    </div>` : '';
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Logged in as</div><div class="value" style="font-size:1rem">${currentUser.email}</div></div>
      <div class="stat-card"><div class="label">User ID</div><div class="value code" style="font-size:.8rem">${currentUser.id}</div></div>
      <div class="stat-card"><div class="label">Full Name</div><div class="value" style="font-size:1rem">${currentUser.full_name || '—'}</div></div>
      <div class="stat-card"><div class="label">Role</div><div class="value" style="font-size:1rem"><span class="badge ${currentUser.role === 'admin' ? 'badge-green' : 'badge-red'}">${currentUser.role}</span></div></div>
    </div>
    <div class="card" style="border:2px solid var(--primary)">
      <div class="card-header"><h2>🚀 Create a Tunnel</h2><button class="btn btn-sm" onclick="navigate('mytunnels', document.querySelector('[data-page=mytunnels]'))">Go to My Tunnels →</button></div>
      <div class="card-body">
        <p style="color:var(--text-dim);font-size:.9rem">Expose your local service to the internet with a single SSH command. Click "My Tunnels" for full instructions.</p>
      </div>
    </div>
    ${adminCards}
    <div class="card">
      <div class="card-header"><h2>System Info</h2></div>
      <div class="card-body">
        <table>
          <tr><td>API Base</td><td class="code">${API}</td></tr>
          <tr><td>Swagger Docs</td><td><a href="/docs" target="_blank">/docs</a></td></tr>
          <tr><td>ReDoc</td><td><a href="/redoc" target="_blank">/redoc</a></td></tr>
          <tr><td>Health Check</td><td><a href="/health" target="_blank">/health</a></td></tr>
        </table>
      </div>
    </div>`;
}

// ---- Users ----
async function loadUsers() {
  const c = document.getElementById('pageContent');
  c.innerHTML = `<div class="card"><div class="card-header"><h2>Users</h2><button class="btn btn-sm" onclick="navigate('register', document.querySelector('[data-page=register]'))">➕ Add User</button></div><div class="card-body"><p class="empty">Loading...</p></div></div>`;
  try {
    const users = await api('/users');
    const tunnels = await api('/tunnels');
    let rows = users.map(u => {
      const userTunnels = tunnels.filter(t => t.user_email === u.email);
      const activeCount = userTunnels.filter(t => t.status === 'active').length;
      const totalRequests = userTunnels.reduce((sum, t) => sum + t.request_count, 0);
      const totalData = userTunnels.reduce((sum, t) => sum + t.bytes_transferred, 0);
      const isOnline = activeCount > 0;
      const statusBadge = isOnline
        ? `<span style="display:inline-flex;align-items:center;gap:.3rem"><span style="width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite"></span><span class="badge badge-green">Online</span></span>`
        : `<span style="display:inline-flex;align-items:center;gap:.3rem"><span style="width:8px;height:8px;border-radius:50%;background:#94a3b8"></span><span class="badge">Offline</span></span>`;
      return `<tr>
        <td>${u.email}</td>
        <td>${u.full_name || '—'}</td>
        <td><span class="badge ${u.role === 'admin' ? 'badge-green' : 'badge-red'}">${u.role}</span></td>
        <td class="code" style="font-size:.8rem">${u.tunnel_token || '—'}</td>
        <td>${statusBadge}</td>
        <td><span class="badge ${activeCount > 0 ? 'badge-green' : ''}">${activeCount}</span></td>
        <td>${totalRequests}</td>
        <td>${(totalData / 1024).toFixed(1)} KB</td>
        <td><button class="btn btn-ghost btn-sm" onclick="viewUser('${u.id}')">View</button></td>
      </tr>`;
    }).join('');
    if (!rows) rows = '<tr><td colspan="9" class="empty">No users found</td></tr>';
    c.innerHTML = `<div class="card">
      <div class="card-header"><h2>Users (${users.length})</h2><button class="btn btn-sm" onclick="navigate('register', document.querySelector('[data-page=register]'))">➕ Add User</button></div>
      <div class="card-body" style="padding:0;overflow-x:auto">
        <table><thead><tr><th>Email</th><th>Full Name</th><th>Role</th><th>Tunnel Token</th><th>Status</th><th>Active Tunnels</th><th>Total Requests</th><th>Total Data</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  } catch (e) { c.innerHTML = `<div class="card"><div class="card-body"><p style="color:var(--red)">${e.message}</p></div></div>`; }
}

async function viewUser(id) {
  try {
    const u = await api(`/users/${id}`);
    const allTunnels = await api('/tunnels');
    const userTunnels = allTunnels.filter(t => t.user_email === u.email);
    let tunnelRows = userTunnels.map(t => `<tr>
      <td><a href="${t.url}" target="_blank" style="color:var(--primary)">${t.url}</a></td>
      <td class="code">${t.subdomain}</td>
      <td>${t.request_count}</td>
      <td>${(t.bytes_transferred / 1024).toFixed(1)} KB</td>
      <td><span class="badge ${t.status === 'active' ? 'badge-green' : 'badge-red'}">${t.status}</span></td>
      <td>${t.created_at.replace('T',' ').substring(0,19)}</td>
    </tr>`).join('');
    if (!tunnelRows) tunnelRows = '<tr><td colspan="6" class="empty">No tunnels yet</td></tr>';
    document.getElementById('pageContent').innerHTML = `<div class="card">
      <div class="card-header"><h2>User Details</h2><button class="btn btn-ghost btn-sm" onclick="loadUsers()">← Back</button></div>
      <div class="card-body">
        <table>
          <tr><td style="width:150px">Email</td><td><strong>${u.email}</strong></td></tr>
          <tr><td>Full Name</td><td>${u.full_name || '—'}</td></tr>
          <tr><td>Role</td><td><span class="badge ${u.role === 'admin' ? 'badge-green' : 'badge-red'}">${u.role}</span></td></tr>
          <tr><td>Tunnel Token</td><td class="code" style="font-size:.85rem"><strong>${u.tunnel_token || '—'}</strong> <button class="btn btn-sm" onclick="copyToClipboard('${u.tunnel_token}')" style="margin-left:.5rem">📋 Copy</button></td></tr>
          <tr><td>SSH Command</td><td class="code" style="font-size:.8rem">ssh -p 2222 -R0:127.0.0.1:PORT -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${u.tunnel_token}@ssh.invitechsg.com</td></tr>
          <tr><td>Custom Domain</td><td>
            <div style="display:flex;gap:.5rem;align-items:center">

async function saveCustomDomain(userId) {
  const domain = document.getElementById('customDomainInput').value.trim();
  if (!domain) { toast('Enter a domain first', 'error'); return; }
  try {
    await api(`/users/${userId}?custom_domain=${encodeURIComponent(domain)}`, 'PUT');
    toast('Custom domain saved');
    viewUser(userId);
  } catch (e) { toast(e.message, 'error'); }
}

async function saveMyCustomDomain(clear) {
  const input = document.getElementById('myCustomDomain');
  const domain = clear ? '' : input.value.trim();
  if (!clear && !domain) { toast('Enter a domain first', 'error'); return; }
  try {
    const resp = await api(`/users/me/custom-domain?custom_domain=${encodeURIComponent(domain)}`, 'PUT');
    toast(clear ? 'Custom domain cleared' : 'Custom domain saved');
    if (clear) input.value = '';
    // Reload My Tunnels to reflect change
    loadMyTunnels();
  } catch (e) { toast(e.message, 'error'); }
}

async function doRegister() {
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const full_name = document.getElementById('regFullName').value || null;
  const role = document.getElementById('regRole').value;
  try {
    const res = await fetch(`${API}/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },

// ---- Timeline helpers ----
function buildSSHCommand() {
  const info = tunnelState.info;
  if (!info) return '';
  const port = tunnelState.localPort;
  const token = tunnelState.token;
  const domain = info.domain;
  const sshPort = info.ssh_port;
  // Use ssh.invitechsg.com for SSH connection (DNS-only, bypasses Cloudflare)
  // Tunnel URLs still use the domain (e.g. https://abc123.invitechsg.com)
  const sshHost = domain.includes('invitechsg.com') ? 'ssh.invitechsg.com' : domain;
  return `ssh -p ${sshPort} -R0:127.0.0.1:${port} -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${token}@${sshHost}`;
}

function updateSSHCommand() {
  const el = document.getElementById('sshCommand');
  if (el) el.textContent = buildSSHCommand();
}

function updateLocalPort(port) {
  tunnelState.localPort = parseInt(port) || 8080;
  updateSSHCommand();
}

function switchOS(os, el) {
  document.querySelectorAll('#osTabs .os-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  tunnelState.os = os;
  const hints = {
    mac: 'Open terminal and paste the following command:',
    linux: 'Open a terminal and paste the following command:',
    windows: 'Open Command Prompt (CMD) and paste the following command:',
  };
  document.getElementById('osHint').textContent = hints[os];
}

function copySSHCmd() {
  copyToClipboard(buildSSHCommand());
}

function copyToken() {
  copyToClipboard(tunnelState.token);
}

function toggleTokenVisibility() {
  const el = document.getElementById('accessToken');
  tunnelState.tokenVisible = !tunnelState.tokenVisible;
  if (tunnelState.tokenVisible) {
    el.value = tunnelState.token;
    el.removeAttribute('type');
  } else {
    el.value = tunnelState.token.substring(0, 4) + '••••••••';
  }
}



function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard!')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('Copied to clipboard!'); } catch (e) { toast('Copy failed', 'error'); }
  document.body.removeChild(ta);
}

// ---- API Explorer ----
function renderApiExplorer() {
  const endpoints = [
    { method: 'GET',    path: '/health',              auth: false, desc: 'Health check' },
    { method: 'POST',   path: '/auth/login',           auth: false, desc: 'Login, get JWT token' },
    { method: 'POST',   path: '/auth/register',       auth: true,  desc: 'Create user (admin only)' },
    { method: 'GET',    path: '/auth/me',              auth: true,  desc: 'Get current user' },
    { method: 'GET',    path: '/auth/tunnel-token',    auth: true,  desc: 'Get your tunnel token' },
    { method: 'POST',   path: '/auth/regenerate-token', auth: true, desc: 'Regenerate your tunnel token' },
    { method: 'GET',    path: '/users',                auth: true,  desc: 'List all users (admin only)' },
    { method: 'GET',    path: '/users/{user_id}',      auth: true,  desc: 'Get user by ID (admin only)' },
    { method: 'PUT',    path: '/users/{user_id}',      auth: true,  desc: 'Update user — email, name, role, password (admin only)' },
    { method: 'DELETE', path: '/users/{user_id}',     auth: true,  desc: 'Delete user (admin only)' },
    { method: 'GET',    path: '/users/{user_id}/tunnels', auth: true, desc: 'Get tunnels for a user (admin only)' },
    { method: 'GET',    path: '/tunnels/info',         auth: true,  desc: 'SSH connection info' },
    { method: 'GET',    path: '/tunnels/my',           auth: true,  desc: 'My active tunnels' },
    { method: 'GET',    path: '/tunnels',              auth: true,  desc: 'List all active tunnels (admin only)' },
    { method: 'GET',    path: '/tunnels/history',      auth: true,  desc: 'Tunnel history from DB (admin only)' },
    { method: 'GET',    path: '/tunnels/stats',        auth: true,  desc: 'Dashboard stats — users, tunnels, requests (admin only)' },
    { method: 'DELETE', path: '/tunnels/{subdomain}',  auth: true,  desc: 'Force-stop a tunnel (admin only)' },
    { method: 'POST',   path: '/tunnels/{subdomain}/stop', auth: true, desc: 'Stop your own tunnel' },
  ];
  let rows = endpoints.map(e => `<tr>
    <td><span class="badge ${e.auth ? 'badge-green' : 'badge-red'}">${e.method}</span></td>
    <td class="code">${e.path}</td>
    <td>${e.auth ? '🔒 JWT' : '—'}</td>
    <td>${e.desc}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="tryEndpoint('${e.method}','${e.path}',${e.auth})">Try</button></td>
  </tr>`).join('');
  return `<div class="card">
    <div class="card-header"><h2>API Explorer</h2></div>
    <div class="card-body" style="padding:0;overflow-x:auto">
      <table><thead><tr><th>Method</th><th>Path</th><th>Auth</th><th>Description</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  </div>
  <div class="card" id="tryCard" style="display:none">
    <div class="card-header"><h2 id="tryTitle"></h2><button class="btn btn-ghost btn-sm" onclick="document.getElementById('tryCard').style.display='none'">Close</button></div>
    <div class="card-body">
      <div class="form-group"><label>Path (edit {user_id} etc.)</label><input type="text" id="tryPath"></div>
      <div class="form-group" id="tryBodyGroup" style="display:none"><label>Request Body (JSON)</label><textarea id="tryBody" rows="5" placeholder='{"email":"...","password":"..."}'></textarea></div>
      <button class="btn" onclick="executeTry()">Send Request</button>
      <div style="margin-top:1rem"><label>Response</label><pre id="tryResult" class="code" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;max-height:300px;overflow:auto;white-space:pre-wrap"></pre></div>
    </div>
  </div>`;
}

let currentTry = {};
function tryEndpoint(method, path, needsAuth) {
  currentTry = { method, needsAuth };
  document.getElementById('tryCard').style.display = 'block';
  document.getElementById('tryTitle').textContent = `${method} ${path}`;
  document.getElementById('tryPath').value = path;
  document.getElementById('tryBodyGroup').style.display = (method === 'POST') ? 'block' : 'none';
  if (method === 'POST' && path === '/auth/register') {
    document.getElementById('tryBody').value = JSON.stringify({ email: 'newuser', password: 'password123', full_name: 'New User', role: 'user' }, null, 2);
  } else if (method === 'POST' && path === '/auth/login') {
    document.getElementById('tryBody').value = JSON.stringify({ email: 'admin', password: 'admin' }, null, 2);
  } else {
    document.getElementById('tryBody').value = '';
  }
  document.getElementById('tryResult').textContent = '';
}

async function executeTry() {
  const path = document.getElementById('tryPath').value;
  const body = document.getElementById('tryBody').value;
  const resultEl = document.getElementById('tryResult');
  resultEl.textContent = 'Sending...';
  try {
    const opts = { method: currentTry.method, headers: {} };
    if (currentTry.needsAuth) opts.headers['Authorization'] = `Bearer ${token}`;
    if (currentTry.method === 'POST' && body) { opts.headers['Content-Type'] = 'application/json'; opts.body = body; }
    const res = await fetch(`${API}${path}`, opts);
    const text = await res.text();
    let formatted = text;
    try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    resultEl.textContent = `Status: ${res.status} ${res.statusText}\n\n${formatted}`;
  } catch (e) { resultEl.textContent = `Error: ${e.message}`; }
}
