<!DOCTYPE html>
<html lang="en" data-color-scheme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — IRAGT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    --brand: #6aa6f0;
    --brand-hover: #4785ea;
    --brand-light: rgba(106,166,240,.15);
    --bg: #141618;
    --surface: #1b1e21;
    --surface-1: #222529;
    --surface-2: #2a2d31;
    --border: rgba(255,255,255,.08);
    --border-hover: rgba(255,255,255,.12);
    --text: #f1f3f5;
    --text-dim: #8a9099;
    --text-muted: #adb3ba;
    --green: #29a97f;
    --red: #de5f4b;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 2.5rem; width: 100%; max-width: 400px; }
  .auth-card .logo { text-align: center; font-size: 1.75rem; font-weight: 800; margin-bottom: .25rem; }
  .auth-card .subtitle { text-align: center; color: var(--text-dim); font-size: .875rem; margin-bottom: 1.75rem; }

  .auth-tabs { display: flex; gap: .25rem; margin-bottom: 1.5rem; background: var(--bg); border-radius: var(--radius); padding: .25rem; }
  .auth-tab { flex: 1; padding: .5rem; text-align: center; cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--text-dim); border-radius: var(--radius); transition: .15s; border: none; background: none; font-family: var(--font); }
  .auth-tab.active { background: var(--brand); color: #fff; }

  .auth-form { display: none; }
  .auth-form.active { display: block; }

  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: .3rem; font-weight: 500; }
  .form-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .75rem; color: var(--text); font-size: .9rem; font-family: var(--font); outline: none; transition: .15s; }
  .form-group input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-light); }
  .form-group input::placeholder { color: var(--text-muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .375rem; background: var(--brand); color: #fff; border: none; border-radius: var(--radius); padding: .55rem 1.25rem; font-size: .9rem; font-weight: 600; font-family: var(--font); cursor: pointer; transition: .15s; width: 100%; margin-top: .5rem; }
  .btn:hover { background: var(--brand-hover); }

  .auth-error { color: var(--red); font-size: .825rem; margin-top: .5rem; display: none; }
  .auth-success { color: var(--green); font-size: .875rem; margin-top: .5rem; display: none; }
  .auth-note { font-size: .8rem; color: var(--text-dim); margin-top: 1.25rem; text-align: center; }
  .back-link { text-align: center; margin-top: 1.5rem; font-size: .825rem; }
  .back-link a { color: var(--text-dim); }
</style>
<style>
  /* v1.3 polish */
  .auth-card { transition: box-shadow .2s, transform .2s; }
  .auth-card:hover { box-shadow: 0 24px 48px -20px rgba(0,0,0,.55); }
  .btn { transition: transform .12s, box-shadow .12s; }
  .btn:hover { transform: translateY(-1px); }
  input:focus { outline: 2px solid color-mix(in srgb, var(--primary, #6366f1) 55%, transparent); outline-offset: 1px; }
  .auth-tab { transition: background .15s, color .15s; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">⚡ IRAGT</div>
  <div class="subtitle">Secure tunnels to localhost</div>

  <div class="auth-tabs">
    <button class="auth-tab" onclick="switchTab('login', this)">Login</button>
    <button class="auth-tab active" onclick="switchTab('register', this)">Sign Up</button>
  </div>

  <!-- Login Form -->
  <div class="auth-form" id="loginForm">
    <div class="form-group">
      <label>Email or Username</label>
      <input type="text" id="loginEmail" placeholder="user@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Password">
    </div>
    <div class="auth-error" id="loginError"></div>
    <div class="auth-success" id="loginSuccess" style="display:none"></div>
    <button class="btn" onclick="doLogin()">Login</button>
    <p class="auth-note"><a href="#" onclick="switchTab('forgot', document.querySelector('.auth-tab:nth-child(1)'));return false">Forgot password?</a> · Don't have an account? <a href="#" onclick="switchTab('register', document.querySelector('.auth-tab:nth-child(2)'));return false">Sign up</a></p>
  </div>

  <!-- Forgot / Reset Form (Job 6) -->
  <div class="auth-form" id="forgotForm">
    <div id="forgotRequestBox">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="forgotEmail" placeholder="user@example.com">
      </div>
      <div class="auth-error" id="forgotError"></div>
      <div class="auth-success" id="forgotSuccess"></div>
      <button class="btn" onclick="doForgot()">Send Reset Link</button>
      <p class="auth-note">If SMTP is not configured, ask the admin to reset your password.</p>
    </div>
    <div id="resetBox" style="display:none">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="resetPassword" placeholder="Min 4 characters">
      </div>
      <div class="auth-error" id="resetError"></div>
      <div class="auth-success" id="resetSuccess"></div>
      <button class="btn" onclick="doReset()">Set New Password</button>
    </div>
    <p class="auth-note"><a href="#" onclick="switchTab('login', document.querySelector('.auth-tab:nth-child(1)'));return false">← Back to Login</a></p>
  </div>

  <!-- Register Form -->
  <div class="auth-form active" id="registerForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="user@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min 4 characters">
    </div>
    <div class="form-group">
      <label>Full Name (optional)</label>
      <input type="text" id="regFullName" placeholder="John Doe">
    </div>
    <div class="auth-error" id="registerError"></div>
    <div class="auth-success" id="registerSuccess"></div>
    <button class="btn" onclick="doRegister()">Create Account</button>
    <p class="auth-note">Already have an account? <a href="#" onclick="switchTab('login', document.querySelector('.auth-tab:nth-child(1)'));return false">Login</a></p>
  </div>

  <div class="back-link"><a href="/">← Back to home</a></div>
</div>

<script>
const API = '/api/v1';

// Check if already logged in — redirect to dashboard/admin
(async function() {
  const token = localStorage.getItem('pinggy_token');
  if (!token) return;
  try {
    const res = await fetch(`${API}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.ok) {
      const user = await res.json();
      window.location.href = user.role === 'admin' ? '/admin' : '/dashboard';
    }
  } catch {}
})();

function switchTab(tab, el) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  if (el) el.classList.add('active');
  const form = document.getElementById(tab + 'Form');
  if (form) form.classList.add('active');
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('registerError').style.display = 'none';
  document.getElementById('registerSuccess').style.display = 'none';
}

// ---- Forgot / reset password (Job 6) ----
let RESET_TOKEN = null;

async function doForgot() {
  const email = document.getElementById('forgotEmail').value.trim();
  const errEl = document.getElementById('forgotError');
  const okEl = document.getElementById('forgotSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Enter your email'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch(`${API}/auth/forgot-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Request failed');
    okEl.textContent = data.detail + ' (If SMTP is off, the link is in email_logs and the admin can hand it over.)';
    okEl.style.display = 'block';
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

function showResetForm(token) {
  RESET_TOKEN = token;
  switchTab('forgot', null);
  document.getElementById('forgotRequestBox').style.display = 'none';
  document.getElementById('resetBox').style.display = 'block';
}

async function doReset() {
  const pw = document.getElementById('resetPassword').value;
  const errEl = document.getElementById('resetError');
  const okEl = document.getElementById('resetSuccess');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (!RESET_TOKEN || pw.length < 4) { errEl.textContent = 'Enter a password (min 4 chars)'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: RESET_TOKEN, new_password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Reset failed');
    okEl.textContent = data.detail + ' Redirecting to login…';
    okEl.style.display = 'block';
    setTimeout(() => { RESET_TOKEN = null; window.location.href = '/login'; }, 1500);
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

// Auto-open reset form when arriving via ?reset=TOKEN
(async function() {
  const params = new URLSearchParams(window.location.search);
  const rt = params.get('reset');
  if (rt) showResetForm(rt);
})();

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Please enter email and password'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    localStorage.setItem('pinggy_token', data.access_token);
    localStorage.setItem('pinggy_user', JSON.stringify(data.user));
    // Replace current history entry so back button doesn't go back to login
    const dest = data.user.role === 'admin' ? '/admin' : '/dashboard';
    window.location.replace(dest);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function doRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const fullName = document.getElementById('regFullName').value.trim();
  const errEl = document.getElementById('registerError');
  const successEl = document.getElementById('registerSuccess');
  errEl.style.display = 'none';
  successEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Please enter email and password'; errEl.style.display = 'block'; return; }
  if (password.length < 4) { errEl.textContent = 'Password must be at least 4 characters'; errEl.style.display = 'block'; return; }
  try {
    const res = await fetch(`${API}/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, full_name: fullName || undefined, role: 'user' })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Registration failed');
    successEl.textContent = 'Account created! Logging you in...';
    successEl.style.display = 'block';
    setTimeout(() => doLoginAfterRegister(email, password), 1000);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

async function doLoginAfterRegister(email, password) {
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error('Login failed');
    localStorage.setItem('pinggy_token', data.access_token);
    localStorage.setItem('pinggy_user', JSON.stringify(data.user));
    // Replace current history entry so back button doesn't go back to login
    window.location.replace('/dashboard');
  } catch (e) {
    switchTab('login', document.querySelector('.auth-tab:nth-child(1)'));
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginError').textContent = 'Account created! Please login.';
    document.getElementById('loginError').style.display = 'block';
  }
}
</script>
</body>
</html>
