# pinggy admin panel + API — HTTPS
server {
    listen 80;
    server_name invitechsg.com *.invitechsg.com;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name invitechsg.com;

    ssl_certificate /etc/ssl/certs/pinggy-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/pinggy-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_access.log;
    error_log /var/log/nginx/pinggy_error.log;
}

# pinggy tunnel subdomains — wildcard for *.invitechsg.com
server {
    listen 443 ssl;
    server_name *.invitechsg.com;

    ssl_certificate /etc/ssl/certs/pinggy-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/pinggy-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_tunnel_access.log;
    error_log /var/log/nginx/pinggy_tunnel_error.log;
}