# nginx configuration for pinggy tunnel service
# Wildcard *.xyz.com — routes all subdomain traffic to FastAPI proxy
#
# Install: sudo cp nginx/pinggy.conf /etc/nginx/sites-available/pinggy
#          sudo ln -s /etc/nginx/sites-available/pinggy /etc/nginx/sites-enabled/pinggy
#          sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP → HTTPS redirect + Let's Encrypt challenge ----
server {
    listen 80;
    listen [::]:80;
    server_name xyz.com *.xyz.com;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS wildcard for tunnel subdomains ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.xyz.com;

    # Wildcard SSL certificate (from Let's Encrypt via certbot DNS challenge)
    ssl_certificate     /etc/letsencrypt/live/xyz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xyz.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Proxy all tunnel traffic to FastAPI (which has the TunnelProxyMiddleware)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for tunneled requests
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Don't buffer — stream directly through the tunnel
        proxy_buffering off;
    }
}

# ---- HTTPS for main site (admin panel, API) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xyz.com;

    ssl_certificate     /etc/letsencrypt/live/xyz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xyz.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Admin panel + API + docs
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}