# nginx config for Docker — pinggy
# HTTP only (Cloudflare Flexible SSL handles HTTPS)

upstream pinggy_app {
    server app:8000;
}

limit_req_zone $binary_remote_addr zone=per_ip_rate:20m rate=6000r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:20m;

# Main domain + wildcard subdomains
server {
    listen 80;
    server_name _;

    limit_req zone=per_ip_rate burst=1000 nodelay;
    limit_conn per_ip_conn 100;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://pinggy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_access.log;
    error_log /var/log/nginx/pinggy_error.log;
}