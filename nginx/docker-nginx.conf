# nginx config for Docker — pinggy
# HTTP only (Cloudflare Flexible SSL handles HTTPS)

upstream pinggy_app {
    server app:8000;
}

# Main domain + wildcard subdomains
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://pinggy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_access.log;
    error_log /var/log/nginx/pinggy_error.log;
}