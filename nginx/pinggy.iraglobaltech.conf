# pinggy admin panel + API — HTTP only (Cloudflare Flexible SSL handles HTTPS)

# Cloudflare forwards the original visitor address in CF-Connecting-IP.
# Only Cloudflare proxy ranges should be trusted for this header.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name iraglobaltech.com *.iraglobaltech.com;

    limit_req zone=per_ip_rate burst=1000 nodelay;
    limit_conn per_ip_conn 100;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_access.log;
    error_log /var/log/nginx/pinggy_error.log;
}

# Catch-all for custom domains — HTTP
server {
    listen 80 default_server;
    server_name _;

    limit_req zone=per_ip_rate burst=1000 nodelay;
    limit_conn per_ip_conn 100;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/pinggy_custom_access.log;
    error_log /var/log/nginx/pinggy_custom_error.log;
}